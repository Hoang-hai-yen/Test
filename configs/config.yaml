# ============================================================================
# AERO EYES — Few-Shot Spatio-Temporal Drone Object Localization
# Master configuration. Every switch here is a real, documented option.
# Override any field via CLI: --set proposal_model=fastsam_s
# ============================================================================

project:
  name: aero_eyes
  # Where intermediate per-stage artifacts + final outputs are written.
  work_dir: ./runs/exp001
  # Re-use cached artifacts (e.g. prototype) instead of recomputing.
  use_cache: true
  seed: 42

# ----------------------------------------------------------------------------
# PIPELINE — which detector implementation runs Stage 1+2+3.
# ----------------------------------------------------------------------------
pipeline:
  detector: legacy   # <<< "legacy" (Stage1/2/3, this file's stage1/stage2/stage3
                      #     sections) | "geco2" (single merged stage using the
                      #     vendored GECO2/ few-shot exemplar detector instead
                      #     -- see the stage123_geco2 section below).
                      # Stage4/Stage5 run unchanged either way.

# ----------------------------------------------------------------------------
# DATA  —  CONFIRM THIS LAYOUT WITH THE USER BEFORE WRITING CODE.
# These are PLACEHOLDER assumptions; the real schema must be verified.
# ----------------------------------------------------------------------------
data:
  # One sample = 3 reference images + 1 drone video (+ optional GT).
  # Confirmed layout (aero-eyes-dataset / PublicTest / samples):
  #   data_root/
  #     <sample_id>/
  #       object_images/   img_1.jpg img_2.jpg img_3.jpg
  #       drone_video.mp4  (any *.mp4 name — video_glob matches by extension)
  data_root: ./data
  refs_subdir: object_images
  video_glob: "*.mp4"
  num_references: 3

  # Ground-truth schema — confirmed by user.
  # Single global annotations file at project root; filter by video_id.
  gt:
    global_file: "annotations (1).json"  # at project root, all videos
    box_format: xyxy          # confirmed: x1,y1,x2,y2 absolute pixels
    normalized: false
    frame_index_base: 0       # confirmed 0-based
    absent_encoding: omit     # confirmed: missing frames = absent
    one_object_per_video: true

  # Submission / output format — confirmed same schema as GT.
  submission:
    path_name: submission.json
    box_format: xyxy
    normalized: false
    frame_index_base: 0
    absent_encoding: omit

# ----------------------------------------------------------------------------
# RUNTIME
# ----------------------------------------------------------------------------
runtime:
  device: auto              # auto | cpu | cuda
  # Jetson/TensorRT explicitly OUT OF SCOPE. CPU/GPU portable only.
  num_workers: 4
  batch_size: 16            # candidate-feature extraction batch
  log_level: INFO
  save_visualizations: true # overlays/heatmaps/annotated video per stage

# ----------------------------------------------------------------------------
# STAGE 1 — Reference processing (offline, runs once per target)
# ----------------------------------------------------------------------------
stage1:
  segmentation:
    enabled: true
    # mobilesam (default, lightest/proven) | fastsam (reuses stage2.fastsam_s's
    # weights/conf/iou/imgsz -- weights below is ignored; no promptable
    # decoder, can only select among its own "segment everything" masks) |
    # sam2 (full standalone SAM2, needs stage123_geco2.repo_path's vendored
    # GECO2/sam2 -- weights below is ignored; heavier/slower per ref image).
    # fastsam/sam2 NOT YET VALIDATED for this reference-masking role --
    # compare against mobilesam on your own footage first.
    model: mobilesam
    weights: null            # path to MobileSAM ckpt; null = auto-download (only used when model=mobilesam)
    fallback_if_missing: passthrough   # passthrough = skip masking, use full image
    # true (default): reject a mask outside [min_area_frac, max_area_frac]
    # or touching the border more than max_border_touch_frac, falling back
    # to the all-ones passthrough for that reference image. false: skip
    # this check entirely and use whatever segment()'s own candidate
    # picked, however oddly sized/bordered -- useful to see a newly-wired
    # model's (fastsam/sam2) raw output unfiltered, since these thresholds
    # were calibrated against MobileSAM's own behavior.
    reject_implausible_mask: true
    # What to do with the non-mask (background) region of a reference image:
    #   mean_fill (default) -- flat mean-color fill.
    #   keep_real -- leave the reference photo's real background untouched.
    #   blur -- strong Gaussian blur of the real background.
    background_mode: mean_fill   # mean_fill | keep_real | blur
    blur_sigma: 25.0             # used when background_mode: blur
  # Crop each reference image to its MobileSAM tight mask box (expanded by
  # crop_context_margin) BEFORE resizing to feature_extractor.image_size --
  # keeps 100% real pixels, just a tighter field of view than the whole
  # photo, so the object occupies a larger fraction of the final canvas.
  # Requires segmentation.enabled. Off by default.
  crop_to_object: false
  crop_context_margin: 0.5
  feature_extractor:
    model: dinov2            # dinov2 | dinov3 | clip | siglip | ensemble (dinov2+clip concat)
    dinov2_variant: vitb14   # vits14 (~22M, 384-d) | vitb14 (~86M, 768-d) | vitl14 (~300M, 1024-d) | vitg14 (~1.1B, 1536-d)
                              # larger variants = stronger features but much slower/heavier; vitl14 is a reasonable next step to try
    # "With registers" DINOv2 (dinov2_{variant}_reg on torch.hub / HF
    # facebook/dinov2-with-registers-*): a few dedicated register tokens give
    # the model scratch space it otherwise repurposes patch tokens for,
    # producing cleaner features per Meta's own ablations -- same output dim
    # as the non-register variant above, drop-in swap. false = original DINOv2.
    dinov2_use_registers: false
    # dinov3_variant: used only when model=dinov3.
    dinov3_variant: vitb16   # vits16 (384-d) | vitb16 (768-d) | vitl16 (1024-d)
    # WHICH pretraining run's weights to load, same architecture either way:
    # lvd1689m (default) = Meta's large natural-image corpus. sat493m =
    # satellite-imagery pretraining -- likely a better domain match for
    # aerial/drone footage. Applies to both sources below; for kaggle,
    # dinov3_kaggle_model_id is what actually decides the weights (this
    # field is bookkeeping/logging only there). Not every
    # (dinov3_variant, dinov3_pretrain_dataset) pair is necessarily
    # published on HuggingFace -- unavailable ones 404 from from_pretrained.
    dinov3_pretrain_dataset: lvd1689m   # lvd1689m | sat493m
    # dinov3_source: "huggingface" (default) -- weights GATED on HuggingFace
    # (facebook/dinov3-{dinov3_variant}-pretrain-{dinov3_pretrain_dataset});
    # request access on the model page with your HF account first, then set
    # HF_TOKEN in the environment before running, or the download will
    # 401/403.
    # "kaggle" -- loads a raw Meta .pth checkpoint via
    # kagglehub.model_download(dinov3_kaggle_model_id) instead, no HF gating
    # needed -- e.g. when a HF repo for the variant/dataset you want isn't
    # published, or you just don't have HF access. Needs `kagglehub`
    # installed and Kaggle API credentials configured.
    dinov3_source: huggingface   # huggingface | kaggle
    # Required when dinov3_source=kaggle -- its own architecture/dataset
    # must match dinov3_variant/dinov3_pretrain_dataset above (this string
    # is the actual weight source; those two fields aren't validated
    # against it).
    dinov3_kaggle_model_id: null   # e.g. "yadavdamodar/dinov3-vitl16-pretrain-sat493m/pyTorch/default"
    clip_variant: vit-b/32   # vit-b/32 (512-d) | vit-l/14 (768-d)
    # siglip_variant: used only when model=siglip. Open access on HuggingFace,
    # no token needed. Vision encoder only (no text tower loaded).
    siglip_variant: base     # base (768-d) | large (1024-d) | so400m (1152-d, slow)
    weights: null            # null = load from torch.hub / hf
    image_size: 224
    # Optional small trained head on top of the frozen backbone above (see
    # scripts/train_projection_head.py) -- closes the domain gap between
    # close-up reference photos and tiny aerial crops WITHOUT fine-tuning
    # the backbone itself. Applies everywhere this extractor is used
    # (Stage 1 prototype, Stage 3/Stage12-GeCo2 candidate features, Stage 4
    # verify_interval). Disabled by default -- no effect unless both
    # enabled=true AND weights_path point at a checkpoint trained against
    # THIS SAME model/variant above (dimension mismatch raises at load).
    projection_head:
      enabled: false
      weights_path: null
      output_dim: 256   # must match --output-dim used when training weights_path
      hidden_dim: null  # must match --hidden-dim used when training weights_path (null = single Linear)
  prototype:
    # How the 3 per-reference feature sets are fused.
    fusion: mean             # mean | max | concat_then_pca
    l2_normalize: true
    cache_name: prototype.npz
  # Degrade reference images (shrink-then-upscale + optional blur) to look
  # more like a distant aerial capture before feature extraction -- shrinks
  # the domain gap between crisp close-up references and the drone's
  # actual view of the object. Both no-ops at their default values.
  aerial_sim:
    enabled: false
    downscale_factor: 1.0   # e.g. 0.5 = shrink to half then upscale back
    blur_ksize: 0            # Gaussian blur kernel size in px, 0 = off
  # DINOv2 analog of stage123_geco2.domain_calibration: shifts the fused
  # prototype (and each per-ref vector, when multi_reference_embedding is
  # active) toward the mean DINOv2 embedding of a few RAW frames sampled
  # from the query video -- an estimate of this video's own general scene/
  # lighting domain (color temperature, exposure, compression, motion
  # blur), independent of where the target object is in those frames.
  # Different from -- and can be combined with -- stage3.dynamic_prototype,
  # which shifts toward matched CANDIDATE CROPS (object-focused, but only
  # available once matching has already found plausible hits) instead of
  # whole frames (background-heavy, but available immediately).
  domain_calibration:
    enabled: false
    num_sample_frames: 5
    strength: 0.3   # 0 = no change, 1 = fully replaced by the video's own mean embedding

# ----------------------------------------------------------------------------
# STAGE 2 — Candidate generation (per keyframe)
# ----------------------------------------------------------------------------
stage2:
  keyframe_interval: 8       # sample 1 keyframe every N frames (5–10 typical)

  sahi:
    use_sahi: true           # <<< SAHI ON/OFF SWITCH
    tile: [640, 640]
    overlap: 0.25            # fraction
    # If false: run the proposal model on the full (resized) frame instead.

  proposal_model: yolov11n   # <<< "yolov11n"  |  "fastsam_s"  (pick exactly ONE)
                             #     YOLOv8 is explicitly NOT allowed.
  yolov11n:
    weights: yolo11n.pt      # ultralytics auto-downloads if absent
    conf: 0.05               # low: class-agnostic recall over precision
    iou: 0.5
    max_det: 300
    classes: null            # null = all classes (class-agnostic use)
  fastsam_s:
    weights: FastSAM-s.pt    # ultralytics auto-downloads if absent
    conf: 0.2
    iou: 0.7
    imgsz: 640

  candidate:
    min_box_area: 16         # discard sub-pixel noise (px^2)
    max_candidates_per_keyframe: 400
    feature_crop_pad: 0.10   # pad each candidate crop before DINOv2

# ----------------------------------------------------------------------------
# STAGE 3 — Cross-domain matching
# ----------------------------------------------------------------------------
stage3:
  # Dev/debug convenience: candidates.json's companion candidates.feats.npz
  # is written by Stage 2 using whatever stage1.feature_extractor was
  # active THEN -- Stage 2's own cache check only looks at whether
  # candidates.json exists, with no awareness of which extractor produced
  # it, so switching feature_extractor.model/variant without clearing that
  # cache leaves a STALE, wrong-dimension .feats.npz that crashes Stage 3's
  # `feats @ ref` with a cryptic shape-mismatch error. The normal fix is to
  # invalidate the cache (project.use_cache=false, or delete
  # candidates.json so Stage 2 reruns) -- but Stage 2 also reruns
  # SAHI/proposal-model box detection, which doesn't depend on the
  # extractor and can be the expensive part on a long video. When true,
  # Stage 3 instead re-extracts features for the EXISTING candidate boxes
  # (no box detection re-run) using the CURRENT feature_extractor, then
  # overwrites candidates.json + candidates.feats.npz in place. false
  # (default) = unchanged, use whatever features are already cached.
  recompute_candidate_features: false
  # Rejects a degenerate, near-zero-AREA candidate box (from
  # candidates.json, whichever pipeline produced it) before it can occupy
  # one of THIS stage's own topk_per_keyframe slots below -- an AREA
  # floor, not a min-side-length one (this project's own GT survey found a
  # real object's thinnest side can legitimately be ~2px at the frame
  # edge, but no real GT box has area <= 16px^2). Reads candidates.json as
  # already written -- no candidate-generation stage needs rerunning to
  # retune this threshold, unlike stage123_geco2.min_box_area_enabled's
  # own version. Does NOT replace that one: it runs BEFORE
  # stage123_geco2.cosine_rescore.candidate_topk_per_keyframe caps the RAW
  # candidate pool, so a degenerate box surviving THAT cap crowds out a
  # real candidate PERMANENTLY (never reaches candidates.json at all),
  # which this later filter can't recover -- running both is the safe
  # choice; this one alone only protects this stage's own
  # topk_per_keyframe cap.
  min_box_area_enabled: false
  min_box_area: 12
  similarity: cosine         # cosine | l1 | l2  (l1/l2 = negated distance, higher still = more similar)
  match_threshold: 0.55      # calibratable; candidates below are dropped (used unless adaptive_threshold below)
  nms_iou: 0.5               # NMS across overlapping SAHI tiles
  topk_per_keyframe: 5       # keep at most K detections per keyframe
  # global_topk: cap the number of surviving candidates across the WHOLE video
  # (applied AFTER threshold filtering). null = no cap. Useful when the ground-
  # to-aerial domain gap pushes the whole similarity distribution down and a
  # fixed threshold alone lets too much noise through.
  global_topk: null          # e.g. 30-100 when domain gap is large
  # adaptive_threshold: instead of a fixed match_threshold, compute
  # per-video threshold = mean(sim) + adaptive_z_score * std(sim), floored at
  # adaptive_min_floor. Robust when the tiny top-down object's absolute
  # similarity to the close-up reference is unpredictable video to video.
  adaptive_threshold: false
  # adaptive_z_score: higher = fewer false positives, lower = more recall.
  # Empirically swept on the aero-eyes-dataset PublicTest samples (DINOv2 +
  # cheap_boosters): z=1.0->0.269, 1.5->0.312, 2.0->0.338 (best), 2.5->0.332,
  # 3.0->0.268 mean ST-IoU. 2.0 is the validated default for this dataset —
  # re-sweep if the domain gap or dataset changes.
  adaptive_z_score: 2.0
  adaptive_min_floor: 0.05   # hard floor: never accept sim below this even if adaptive
  # mean/std above are computed on all_sims AS-IS -- when multi_reference_embedding
  # pools scores across per_ref_features (max, typically) and dynamic_prototype
  # below has APPENDED extra reference vectors derived from a narrow, self-selected
  # candidate subset, other candidates that happen to match those new (narrow)
  # references well get inflated scores via max-pooling -- dragging mean/std up
  # and raising the threshold for EVERYONE, including true positives whose own
  # score never changed. When true, mean/std (or median/MAD, see
  # adaptive_threshold_robust) are computed from the similarity distribution
  # BEFORE dynamic_prototype ran instead -- stable, not draggable by whatever it
  # appends later -- while candidate ACCEPTANCE still uses the full pooled
  # scores, so dynamic_prototype's recall benefit is kept, just not its ability
  # to also move the goalpost. No-op when dynamic_prototype is disabled.
  adaptive_threshold_anchor_to_original_refs: false
  # mean+std is sensitive to a small number of outlier-high scores -- exactly
  # what a narrow dynamic_prototype addition (or any other skew) produces.
  # median + z_score*MAD is far less moved by a handful of outliers. Combines
  # with adaptive_threshold_anchor_to_original_refs above (independent knobs).
  # false (default) = mean/std, unchanged.
  adaptive_threshold_robust: false
  # EXPERIMENTAL, not yet validated on this project's own footage -- see
  # Stage3Config.adaptive_threshold_method's own docstring for the full
  # rationale. z_score (default) picks the threshold as center +
  # adaptive_z_score*spread -- one fixed z can't serve both a low-FP video
  # (needs a LOWER z, mean/median is already near the true-positive level)
  # and a high-FP video (needs a HIGHER z, mean/median is dragged down by
  # the FP mass) at once. otsu/gmm instead adapt the threshold to the
  # ACTUAL shape of this video's own similarity distribution, no z to
  # hand-tune. Compare against the z_score baseline on your own footage
  # (e.g. scripts/sweep_zscore_loocv.py-style before/after) before trusting
  # either in production.
  adaptive_threshold_method: z_score   # z_score | otsu | gmm
  adaptive_threshold_min_samples: 20   # otsu/gmm fall back to z_score below this many candidates -- too little data for a shape-based split to be reliable
  adaptive_otsu_bins: 256
  adaptive_gmm_min_separation_std: 1.5   # gmm: min separation (in pooled std) between the 2 fitted components to trust a bimodal split
  adaptive_gmm_fallback_percentile: 20.0 # gmm: percentile cut used when the fit looks unimodal (no real background cluster found)
  # EXPERIMENTAL, opt-in: real-time-deployment-compatible variant of
  # adaptive_threshold. z_score/otsu/gmm above all need the WHOLE video's
  # candidates before they can decide anything -- fine for offline/batch
  # evaluation on a pre-recorded file, but incompatible with a live drone
  # feed where future frames don't exist yet. When true, each keyframe's
  # threshold is computed from only the PRIOR keyframes' own similarity
  # scores (a running window of size adaptive_threshold_online_window),
  # cold-starting at adaptive_min_floor until adaptive_threshold_min_samples
  # have been observed. Mutually exclusive with stage3.dynamic_prototype
  # below (also whole-video) -- forced off with a warning if both are on.
  # NOT YET VALIDATED -- compare against the batch baseline on recorded
  # footage before trusting it for a live feed.
  adaptive_threshold_online: false
  adaptive_threshold_online_window: 200
  # Optional auto-calibration of match_threshold on a labelled subset.
  calibrate:
    enabled: false
    target_metric: st_iou
    search_range: [0.40, 0.75]
    steps: 8
  # Optional 2-pass matching: after the initial similarity pass, pick
  # candidates scoring above an ADAPTIVE (percentile-of-THIS-sample)
  # threshold instead of a fixed cutoff -- a fixed cutoff only ever fires
  # for "easy" targets whose scores are already high; a "hard" target's
  # scores may never clear it, so the mechanism silently never activates.
  # Blends those high-confidence candidates' mean feature into the
  # prototype and re-scores, repeated for `rounds` passes so the prototype
  # drifts toward this specific video's own appearance of the target.
  # Disabled by default -- leaves single-pass matching above unchanged.
  dynamic_prototype:
    enabled: false
    rounds: 2
    alpha: 0.3                    # blend weight of the new high-confidence mean feature into the prototype
    high_conf_percentile: 90.0    # percentile of THIS sample's own score distribution
    high_conf_abs_floor: 0.15     # absolute floor, so a low-scoring sample doesn't update from noise
    min_support: 2                # minimum high-confidence candidates required to update; else stop early
    # min_support only checks COUNT -- a handful of near-duplicate frames (e.g.
    # 3 consecutive keyframes of the same unmoving pose) clears it just as
    # easily as 3 genuinely different views, but only the latter is safe to
    # generalize from. When true, a round's high-confidence picks must ALSO
    # span at least min_frame_span frames before being trusted -- cheap proxy
    # for "the target's appearance actually varies across these picks".
    # Rounds failing this stop the loop early instead of updating from an
    # unrepresentative slice. false (default) = unchanged, count-only gate.
    require_diverse_picks: false
    min_frame_span: 30

# ----------------------------------------------------------------------------
# STAGE 1+2+3 REPLACEMENT — GeCo2 exemplar detector.
# Only used when pipeline.detector == "geco2". Ignores stage1/stage2/stage3
# above entirely; still produces detections.json for Stage 4/5 to consume.
#
# GeCo2 is a single-image few-shot detector: its exemplar boxes normally
# live INSIDE the image being detected on. aero_eyes' 3 reference images are
# separate photos, so each is treated as its own exemplar box = the whole
# image (they're already close-up crops of the target) and encoded
# independently; see aero_eyes/models/geco2_detector.py for the full
# rationale. No SAHI tiling / multi-scale scan is applied on the query
# frame here (accuracy.mode boosters below don't apply to this path) —
# very small objects may need a smaller keyframe crop for good recall.
#
# Requires: the vendored GECO2/ repo's own deps (hydra-core, omegaconf,
# iopath, its bundled sam2 package -- see GECO2/install.sh) installed, and
# CNTQG_multitrain_ca44.pth downloaded into weights_path (see GECO2/README.md).
# ----------------------------------------------------------------------------
stage123_geco2:
  repo_path: ./GECO2
  weights_path: ./GECO2/CNTQG_multitrain_ca44.pth
  # Same foreground masking as stage1.segmentation (background filled with
  # the ref image's own mean color) -- applied before ref_downscale_factor
  # below. Same fields/defaults/model choices as stage1.segmentation.
  segmentation:
    enabled: true
    model: mobilesam   # mobilesam | fastsam | sam2 -- see stage1.segmentation.model's own comment
    weights: null
    fallback_if_missing: passthrough
    min_area_frac: 0.05    # reject a mask smaller than this fraction of the frame
    max_area_frac: 0.95    # reject a mask larger than this fraction of the frame
    # Of SAM's 3 candidate masks, only ones scoring within this ratio of the
    # best score are eligible for the "prefer largest" pick -- raise toward
    # 1.0 if masks are still bleeding into background (over-segmenting);
    # lower toward 0.0 if masks are still cutting off part of the object
    # (under-segmenting).
    score_ratio_floor: 0.85
    # Reject a candidate whose mask touches the real image border more than
    # this fraction of edge pixels (box prompt is inset 5% from the edges,
    # so a correctly-segmented subject essentially never reaches it; a
    # background plane commonly runs off-frame). Raise if legitimate subjects
    # in your reference photos are shot edge-to-edge with no margin.
    max_border_touch_frac: 0.02
    # Center-point prompt (in addition to the box prompt) assumes the
    # geometric center pixel is foreground -- breaks down for ring/donut-
    # shaped objects (e.g. a life ring) whose center is a HOLLOW interior
    # (background), which can bias SAM's mask proposals toward confused/
    # leaky boundaries (confirmed empirically: life-ring reference photos
    # showed both border-touching passthrough failures AND loose/over-
    # inclusive masks on the candidate that WAS accepted). Set false to
    # prompt with the box alone for object shapes like this.
    use_point_prompt: true
    # See stage1.segmentation.reject_implausible_mask's own comment --
    # false skips the min/max_area_frac + max_border_touch_frac check
    # entirely, using whatever segment() picked as-is.
    reject_implausible_mask: true
    # What to do with the non-mask (background) region of a reference image:
    #   mean_fill (default) -- flat mean-color fill. Cheapest, but a large
    #     flat, textureless region is far outside what the backbone
    #     (pretrained on natural photos) ever saw -- can push the exemplar
    #     token into an unnatural part of feature space.
    #   keep_real -- leave the reference photo's real background untouched
    #     (mask still controls the RoI-Align box, just not the pixels).
    #   blur -- strong Gaussian blur of the real background: keeps natural
    #     color/texture statistics, discards fine background detail.
    background_mode: keep_real
    blur_sigma: 25.0   # used when background_mode: blur
    # When the segmenter's own mask area ratio falls outside
    # [min_valid_mask_ratio, max_valid_mask_ratio], replace it with a safe
    # rectangular center-crop mask (center_fallback_ratio of the frame)
    # instead of passing the implausible mask straight through -- an
    # almost-empty mask is likely pure noise; an almost-full mask is
    # effectively a whole-image passthrough that lets background bleed
    # straight into the exemplar and corrupts matching downstream.
    # Reference photos are always close-up shots with the target centered,
    # so a center-crop is a reasonable stand-in for "the object" either way.
    # Off by default -- does not change existing runs unless opted in.
    center_crop_fallback: false
    min_valid_mask_ratio: 0.03
    max_valid_mask_ratio: 0.92
    center_fallback_ratio: 0.75
  image_size: 1024
  emb_dim: 256
  kernel_dim: 3
  reduction: 16
  keyframe_interval: 8       # same meaning as stage2.keyframe_interval
  # Per-frame relative threshold: keep detections with score >
  # box_v.max() * score_threshold_ratio. GeCo2's raw score is not
  # comparable across frames/videos, so (unlike stage3.match_threshold)
  # this can't be a fixed absolute cutoff. 0.33 mirrors GECO2/demo_gradio.py's
  # default threshold slider value.
  score_threshold_ratio: 0.33
  # Absolute floor on a frame's OWN max score, independent of the ratio
  # above -- GeCo2 was trained on FSC147 where every image guarantees an
  # instance of the counted class, so score_threshold_ratio ALONE can never
  # express "target absent this frame" (it always keeps >=1 box whenever
  # max score > 0). If a frame's peak score doesn't clear this floor, no
  # boxes are returned for that frame at all. 0.0 = disabled (old behavior).
  # DO NOT guess this value -- run scripts/check_geco2_score_separation.py
  # on your own present/absent-labeled frames first, then set it just above
  # the highest score seen on a genuinely "absent" frame (with margin).
  score_threshold_abs: 0.0
  nms_iou: 0.5
  topk_per_keyframe: 5
  # GeCo2's box regression has no built-in guard against a degenerate,
  # near-zero-area box -- nothing else here rejects one, and a sliver crop
  # later chokes feature extractors (ambiguous channel dimension warnings).
  # This is an AREA floor, not a min-side-length one: surveyed this
  # project's own GT (14233 boxes, 10 videos) and a real object's thinnest
  # side can legitimately be ~2px at the frame edge (entering/leaving
  # frame), but no real GT box has area <= 16 -- so filtering by area
  # catches degenerate boxes without rejecting real thin-but-long ones.
  # min_box_area's default (24) matches the smallest real box observed --
  # validate against your own GT before changing it, don't guess.
  min_box_area_enabled: false
  min_box_area: 12
  prototype_cache_name: geco2_prototype.pt   # cached exemplar tokens (torch, not prototype.npz)

  # --------------------------------------------------------------------
  # Optional alternative to score_threshold_ratio/score_threshold_abs above:
  # a keyframe with no real target still has a "best" box by construction
  # (per-frame-relative thresholding), so across a whole video that means
  # stray boxes on every empty frame. Instead: pool raw scores across EVERY
  # keyframe in the whole video first, then compute ONE global threshold =
  # max(abs_floor, mean + z_score*std) over that pooled distribution
  # (capped at the video's own observed max) -- same style of fix as
  # stage3.adaptive_threshold, applied to GeCo2's own score. Costs a second
  # pass over the video's keyframes, but reuses each frame's already-
  # computed raw backbone output, so it does NOT double GeCo2 forward
  # passes. Disabled by default. Only applies when
  # stage123_geco2.cosine_rescore.enabled is false (that path's own Stage 3
  # cosine matching decides the final threshold instead).
  # --------------------------------------------------------------------
  global_adaptive_threshold:
    enabled: false
    z_score: 1.0
    abs_floor: 0.15

  # --------------------------------------------------------------------
  # Optional extra matching pass inserted between GeCo2 detection and
  # Stage 4 tracking. When enabled, GeCo2 no longer decides detections.json
  # alone: it first produces a WIDER per-keyframe candidate set (using
  # candidate_score_threshold_ratio/candidate_topk_per_keyframe below
  # instead of score_threshold_ratio/topk_per_keyframe above), each
  # candidate crop is embedded with a SEPARATE DINOv2 prototype (built the
  # same way stage1 above does, from the same 3 reference images -- an
  # independent signal from a different backbone than GeCo2's own Hiera),
  # and stage3's cosine matching (+ stage3.dynamic_prototype, if enabled)
  # does the actual threshold/NMS/top-K filtering that writes
  # detections.json. Stage 3 and Stage 4 then run as one merged step
  # (aero_eyes/stages/stage34.py) so a --from-stage resume can never run
  # tracking against a stale/missing detections.json.
  # Disabled by default -- GeCo2 alone decides detections.json, unchanged.
  # --------------------------------------------------------------------
  cosine_rescore:
    enabled: false
    # Looser than score_threshold_ratio/topk_per_keyframe above -- this
    # stage only needs to not throw away the true positive; stage3's
    # cosine matching does the real cut.
    candidate_score_threshold_ratio: 0.15
    candidate_topk_per_keyframe: 15
  # Shrink each ref image before encoding as an exemplar, to narrow the
  # ground-to-aerial domain gap (close-up ref photos are otherwise much
  # crisper/larger-looking than the object as it actually appears in the
  # drone video). 1.0 = no-op (default). The shrunk image still gets
  # upscaled back up to image_size by resize_and_pad -- so the effective
  # blur depends on shrunk-size vs image_size, not just this factor alone
  # (a given factor blurs a low-res ref photo far more than a high-res one).
  # NOTE: proven a no-op on the object's final SIZE on the model's canvas --
  # resize_and_pad always re-normalizes the whole image's longer side back
  # to image_size regardless of any uniform pre-shrink, so this only affects
  # blur/detail. Use scale_calibration below to fix apparent-size mismatch.
  ref_downscale_factor: 1.0   # e.g. 0.125 = resize down to 1/8 size
  # Multi-blur appearance-token ensemble (opt-in -- config toggle since we
  # don't yet know if it helps): when set, OVERRIDES ref_downscale_factor
  # above with one exemplar entry per (ref image, factor in this list), all
  # concatenated into one exemplar token sequence -- cross-attention
  # attends over all of them and can pick whichever blur/detail level best
  # matches this query object's own apparent scale, instead of one
  # hand-picked factor that may only suit one altitude/distance.
  # null (default) = old single-factor behavior, unchanged.
  ref_downscale_levels: null   # e.g. [1.0, 0.3, 0.1, 0.03]
  # Crop each ref image to its MobileSAM tight mask box (expanded by
  # crop_context_margin) BEFORE resize_and_pad -- keeps 100% real pixels, no
  # masking/fill (unlike background_mode above), just a tighter field of
  # view than the whole reference photo. Since resize_and_pad always
  # renormalizes the (now smaller) image's longer side back up to
  # image_size, the object ends up occupying a LARGER fraction of the 1024
  # canvas -- RoI-Align pools from more feature-map cells, higher-resolution
  # appearance token. Unlike scale_calibration below, needs NO oracle
  # knowledge of the deployment video's apparent object size -- purely a
  # function of the reference photo's own object bounds. Requires
  # segmentation.enabled.
  crop_to_object: false
  crop_context_margin: 0.5   # extra padding around the tight box, as a fraction of the box's own size

  # --------------------------------------------------------------------
  # Fixes the ground-to-aerial SIZE mismatch ref_downscale_factor cannot
  # fix (see note above): builds a synthetic canvas per reference image,
  # centered on the MobileSAM tight mask box, sized so the object occupies
  # the same fraction of the canvas as it's expected to occupy in the query
  # video frame after ITS OWN resize_and_pad. Requires segmentation.enabled
  # (needs the tight mask box). See
  # aero_eyes/stages/stage123_geco2.py::_build_scale_calibrated_canvas.
  # --------------------------------------------------------------------
  scale_calibration:
    enabled: false
    # Expected apparent size(s) [width, height] in pixels of the object AS
    # IT APPEARS IN THE RAW VIDEO FRAME (before any resize/pad) -- estimate
    # from flight altitude/GSD, or eyeball it on a sample frame. Required
    # when enabled: true -- do NOT guess a value blind, a wrong estimate
    # actively hurts (recreates the same kind of scale mismatch this exists
    # to remove, just in a different direction).
    # Accepts a single [w, h] pair (shorthand for one scale, e.g. [22, 18])
    # OR a list of pairs to hedge across several plausible apparent sizes,
    # e.g. [[18, 15], [26, 22], [34, 29]] -- see multi_scale_mode below for
    # how more than one scale is actually used.
    expected_object_px: null
    # "first" (default): only expected_object_px[0] is used -- one
    #   calibrated canvas per reference image, unchanged from before this
    #   option existed.
    # "all": one calibrated canvas per (reference image, scale) pair, each
    #   fed into GeCo2 as its own exemplar entry -- own appearance token
    #   AND (when use_shape_token: true) own shape token per scale. Costs
    #   num_refs*num_scales backbone passes instead of num_refs.
    multi_scale_mode: first   # "first" | "all"
    # Extra padding kept around the tight mask box, as a fraction of the
    # object's own size, before that (object+margin) footprint is
    # calibrated to expected_object_px -- gives the model a bit of
    # surrounding context instead of the object filling the canvas
    # edge-to-edge.
    context_margin: 0.5

  # --------------------------------------------------------------------
  # Shifts exemplar APPEARANCE tokens (not shape tokens) toward the
  # feature-space region the backbone actually produces for THIS video's
  # own frames. Even with correct scale + a natural background
  # (segmentation.background_mode != mean_fill), encoding the reference
  # photo and the query frame are two independent backbone forward passes
  # with two different self-attention contexts -- this corrects the
  # resulting systematic token-statistics gap, independent of the object's
  # true appearance. See GeCo2Detector.estimate_domain_shift /
  # calibrate_prototype.
  # --------------------------------------------------------------------
  domain_calibration:
    enabled: false
    num_sample_frames: 5   # unlabeled video frames sampled to estimate "this video's own domain"
    strength: 1.0           # 0 = no change, 1 = fully match the video's own mean token

  # --------------------------------------------------------------------
  # ONLINE/incremental analog of stage3.dynamic_prototype for GeCo2's OWN
  # exemplar tokens -- stage3's version is a 2-pass mechanism (match the
  # WHOLE video once, pick a percentile-of-the-whole-video's high scorers,
  # blend, re-score), but stage123_geco2.py processes keyframes in ONE
  # sequential pass, so there's no "whole video" distribution to compute a
  # percentile from until it's too late to help frames already processed.
  # Instead, this appends new exemplar tokens to the prototype's own K/V
  # sequence AS THE VIDEO IS PROCESSED (adapt_features already treats
  # prototype tokens as an arbitrary-length sequence -- see
  # GeCo2Detector.encode_exemplars -- so more tokens need no architecture
  # change), using a sliding window (max_tokens, FIFO) instead of a
  # percentile cut.
  #
  # GeCo2's own score is relative-only (see score_threshold_abs above) --
  # a confidently-scored box can still be a confuser, and there's no
  # reliable percentile-of-a-small-streaming-sample to fall back on early
  # in a video. So a candidate is NOT trusted on GeCo2's own score alone --
  # it must ALSO clear consecutive-hit confirmation (min_consecutive_hits,
  # same mechanism as stage4.confirm_detections) AND an independent cosine
  # cross-check (cross_check_source/cross_check_threshold below) before its
  # tokens get appended.
  #
  # Not yet benchmarked -- compare with scripts/check_box_refine_effect.py-
  # style before/after runs on your own footage before trusting it.
  # --------------------------------------------------------------------
  dynamic_prototype:
    enabled: false
    max_tokens: 5              # sliding-window cap on APPENDED token-sets (FIFO); original ref tokens never evicted
    # IMPORTANT: "consecutive" = consecutive PROCESSED KEYFRAMES (spaced
    # keyframe_interval RAW FRAMES apart, default 8 -- ~0.27s at 30fps),
    # NOT consecutive video frames -- GeCo2 never runs between keyframes in
    # this stage. That gap is enough for a small/rotating object (e.g. a
    # handheld ID card) to move more than adjacent-frame tracking would, so
    # consecutive_hits_iou is a stricter bar than its number suggests. If
    # the run's dynamic_prototype summary log shows offers >> confirmed,
    # lower this (or keyframe_interval itself, at the cost of more GeCo2
    # forward passes per video).
    min_consecutive_hits: 2
    consecutive_hits_iou: 0.5
    # "feature_extractor" (default, RECOMMENDED): embeds the candidate crop
    #   with stage1.feature_extractor (whatever model is configured there)
    #   and compares against Stage 1's OWN prototype.npz -- the SAME
    #   reference-image embedding stage4.geco2_redetect_cosine_filter
    #   already cross-checks GeCo2 re-detects against. A genuinely
    #   INDEPENDENT model from GeCo2's own Hiera backbone.
    # "hiera": reuses GeCo2's OWN backbone feature instead (no second model
    #   to load) -- but NOT actually independent: GeCo2's own score is
    #   ALREADY effectively a learned similarity between the SAME two
    #   things in the SAME Hiera space (see adapt_features), so a confuser
    #   that fools the score is likely to also score high here (correlated
    #   failure, not a second opinion). Exposed for you to A/B test
    #   yourself -- don't assume it works as well as "feature_extractor"
    #   without checking.
    cross_check_source: feature_extractor   # feature_extractor | hiera
    cross_check_threshold: 0.5
    # Opt-in: instead of the hand-set cross_check_threshold above, compute
    # the MIN pairwise cosine among the 3 reference images' OWN embeddings
    # (an empirical per-sample ceiling on how similar this domain's genuine
    # matches even look) and use ref_self_sim * ratio as the effective
    # threshold -- self-drops with the domain gap instead of needing manual
    # per-video retuning. Needs cross_check_source=feature_extractor and
    # accuracy.cheap_boosters.multi_reference_embedding=true (falls back to
    # the plain cross_check_threshold above, with a warning, otherwise).
    # Governs offer()'s gate and offer_topk()'s cold-start/fallback gate --
    # NOT topk_fusion's own warmed-up fused_score/acceptance_z_threshold
    # gate (see topk_fusion.min_absolute_cosine_floor_self_calibrate below
    # for the equivalent there).
    cross_check_threshold_self_calibrate: false
    cross_check_threshold_self_calibrate_ratio: 0.7
    # Opt-in second full sweep over the video after pass 1 finishes. Pass 1
    # runs as described above; if it accepted >=1 dynamic token, pass 2
    # re-detects every keyframe from frame 1 again using that FINAL
    # prototype -- frozen, no more online updates -- instead of pass 1's
    # prototype which only grows richer as the video progresses. Targets
    # EARLY frames that only ever saw the 3 original reference images and
    # may have missed a target whose on-video look differs a lot from them
    # (angle/lighting/scale), even though by the end of pass 1 the
    # accumulated tokens would have caught it easily. Pass 2's
    # detections/candidates and viz REPLACE pass 1's outright (not a
    # merge). Costs ~2x the per-video GeCo2 forward-pass time. No-op if
    # pass 1 accepted zero dynamic tokens (pass 2 would be identical).
    second_pass: false
    # Opt-in, ONLY has an effect in the cosine_rescore path
    # (run_stage12_geco2_candidates, i.e. stage123_geco2.cosine_rescore.
    # enabled=true) -- no-op in the plain path, and no-op if
    # cross_check_source is "hiera" instead of "feature_extractor" (both
    # would need K embeddings/backbone-passes per keyframe instead of the
    # current 1-per-confirmation design; only cosine_rescore already pays
    # that cost anyway, for candidates.json). Considers EVERY surviving
    # GeCo2 candidate this keyframe (not just the single highest-scoring
    # one) -- fixes the case where a confuser outscores the real target
    # that keyframe and the real target never even gets looked at.
    # fused_score_i = cosine_weight*cosine_z_i + (1-cosine_weight)*geco2_z_i,
    # both Z-scored against a running window of this SAME sample's own past
    # chosen-candidate values (self-calibrating to this reference-photo
    # set's own domain gap, instead of a hand-tuned absolute cosine cutoff
    # per video). The box with the highest fused_score is what's offered to
    # the consecutive-hit confirmer; once confirmed, accepted if
    # fused_score >= acceptance_z_threshold -- REPLACES cross_check_
    # threshold's plain cutoff for topk_fusion's own acceptance decision.
    topk_fusion:
      enabled: false
      cosine_weight: 0.5          # feature_extractor cosine's weight; GeCo2's own score gets (1 - this)
      running_window: 50          # keyframes of history kept for the Z-score baseline
      min_window_for_zscore: 10    # cold-start: falls back to plain boxes[0]+cross_check_threshold below this
      acceptance_z_threshold: 0.0 # 0.0 = at/above this sample's own running-average candidate quality
      # 3 independent opt-in guards against the running_window baseline being
      # self-poisoned by a persistently-confusable scene (a confuser that
      # keeps winning argmax bakes itself into the baseline as "normal" --
      # see Geco2DynamicPrototypeTopKFusionConfig's docstring). All default
      # off (unchanged behavior); recommended to A/B one at a time.
      intra_frame_baseline: false      # true: Z-score against THIS FRAME's own candidates (no history needed, immune to past-frame poisoning) instead of running_window, when the frame has >= intra_frame_min_boxes candidates
      intra_frame_min_boxes: 3         # min candidates this keyframe needs for intra_frame_baseline's own stats to be trusted; falls back to running_window history below this
      history_update_on_append_only: false  # true: running_window only records a candidate once it's actually appended to the dynamic prototype, not every argmax pick that was merely offered
      min_absolute_cosine_floor_enabled: false  # true: also require raw cosine >= min_absolute_cosine_floor to accept, regardless of fused_score -- same role as stage3.dynamic_prototype.adaptive_min_floor
      min_absolute_cosine_floor: 0.05
      # Opt-in, only matters when min_absolute_cosine_floor_enabled is also
      # true: same ref-vs-ref self-similarity ceiling as dynamic_prototype.
      # cross_check_threshold_self_calibrate above, but with a LOWER ratio
      # -- this floor is a sanity backstop under fused_score acceptance,
      # not the acceptance bar itself. Replaces min_absolute_cosine_floor
      # with ref_self_sim * ratio.
      min_absolute_cosine_floor_self_calibrate: false
      min_absolute_cosine_floor_self_calibrate_ratio: 0.3

  # --------------------------------------------------------------------
  # DIAGNOSTIC/ABLATION: box size feeds the exemplar prototype through TWO
  # independent paths -- (1) shape_or_objectness(w,h) -> a dedicated shape
  # token, and (2) the box coordinates that define the RoI-Align pooling
  # REGION for the appearance token (main/l1/l2). use_shape_token: false
  # disables ONLY path (1) -- it does NOT fix path (2) (a wrong-scaled box
  # still pools the wrong region for appearance either way). Combine with
  # scale_calibration.enabled to isolate which path matters:
  #   true,  scale_calibration=false -- current default (both paths "wrong")
  #   false, scale_calibration=false -- isolates path (1) alone
  #   true,  scale_calibration=true  -- both paths fixed
  #   false, scale_calibration=true  -- path (2) fixed, path (1) removed entirely
  # --------------------------------------------------------------------
  use_shape_token: true

  # --------------------------------------------------------------------
  # Cheap post-detection filter for GeCo2's blind spot: it's a few-shot
  # COUNTING model matching shape/texture via its vision backbone -- no
  # explicit color signal, so same-silhouette-different-color objects are
  # a common false positive. Compares each candidate box against the
  # reference object's own color signature (built once from the
  # MobileSAM-masked reference photos, cached to color_signature.npz).
  # Pure OpenCV, no extra model, no finetuning. Falls back to the WHOLE
  # reference photo's color (diluted by background) if
  # segmentation.enabled=false.
  #
  # TWO signals are blended by color_confidence:
  #   - Hue+Saturation histogram (brightness ignored -- robust to lighting
  #     differences between the reference photo and the video frame) --
  #     reliable for colorful objects, but Hue is unstable/noisy for
  #     near-achromatic (black/white/gray) ones.
  #   - Value/brightness histogram -- the ONE property that reliably
  #     separates black from white/gray, exactly where Hue+Saturation
  #     carries no signal. More lighting-sensitive, so down-weighted for
  #     colorful objects (see saturation_value_confidence in
  #     aero_eyes/utils/color.py).
  # effective_similarity = confidence*sim_hue_sat + (1-confidence)*sim_value
  #
  # EMPIRICALLY CONFIRMED (not just theoretical), in this order: (1) a
  # black-ish reference object (mean saturation=60.1, value=121.3) saw
  # ST-IoU DROP even with a correctly-sized histogram (0.4264 -> 0.3902)
  # using Hue+Saturation alone; (2) Value was blended in specifically
  # because, even after that fix, the detector still visibly confused a
  # similarly-shaped WHITE object in the output video -- Hue+Saturation
  # structurally cannot catch that (both black and white can have
  # arbitrary/unstable Hue), only Value can.
  # --------------------------------------------------------------------
  color_postfilter:
    enabled: false
    # Deliberately COARSE (not the ~30x32 "whole photo" tutorial default):
    # candidate crops here can be as small as ~20x10px (~200 pixels).
    # EMPIRICALLY CONFIRMED: a 960-bin (30x32) histogram from that few
    # pixels is severely under-sampled -- even a GENUINELY correct-color
    # match only scored ~0.49 similarity (barely above min_similarity's
    # default floor, easily pushed below it by real-world noise), while
    # 12x8=96 bins scored ~0.83 on the identical case, with NO loss of
    # discrimination against a truly different color (both scored ~0.0).
    # This was the actual root cause of a catastrophic real-world failure
    # (ST-IoU 0.4264 -> 0.0094, detected frames dropped ~75%) before this
    # default was lowered. Re-validate with your own crop sizes if raised.
    hue_bins: 12
    sat_bins: 8
    value_bins: 8   # for the separate Value-only histogram, same small-crop reasoning
    metric: bhattacharyya   # bhattacharyya | correlation
    # Candidates scoring below this similarity (~0..1, higher=more similar)
    # against EVERY reference photo are dropped outright. This is the ONLY
    # mechanism that should filter by color -- see reweight below for why
    # letting color CHANGE surviving candidates' scores is dangerous.
    # 0.0 = color_postfilter becomes a pure no-op.
    min_similarity: 0.3
    # DEFAULT FALSE -- EMPIRICALLY CONFIRMED HARMFUL, not just theoretical.
    # aero_eyes/stages/stage4.py picks the keyframe candidate to
    # (re)initialize the tracker from via `max(dets, key=lambda d:
    # d.similarity)` -- i.e. it re-runs argmax over exactly this score, so
    # reweighting by a noisy signal (Value/brightness is lighting-sensitive)
    # can flip WHICH candidate wins even when NOTHING is ever hard-dropped,
    # silently swapping in a wrong box that then persists via tracking for
    # up to max_track_age frames. Confirmed on real data: reweight=true
    # with min_similarity=0.0 (no hard-drop -- identical candidate sets
    # survive as min_similarity=0.3) produced the exact same degraded
    # ST-IoU as min_similarity=0.3, proving 100% of the harm was the score
    # multiplication itself. Leave false; let min_similarity above be the
    # only thing that changes which candidates survive.
    reweight: false
    # Blend ramp (NOT a hard on/off cutoff): below min_ref_saturation,
    # color_confidence=0 (100% Value-based comparison); at/above
    # saturation_full_confidence, confidence=1 (100% Hue+Saturation);
    # linearly interpolated in between. mean saturation = 0-255, over the
    # masked object pixels, averaged across all 3 ref photos.
    # 65.0 (not the naive-looking 40.0): a real black reference object in
    # this codebase's own test data measured mean_saturation=60.1 (S is a
    # ratio, so sensor noise on dark pixels inflates it) -- with a 40.0
    # floor that still leaked ~22% confidence onto Hue+Saturation (unreliable
    # for dark objects) instead of relying on Value as intended. 65.0 sits
    # just above that observed noise floor. Check the mean_saturation
    # build_color_signature logs for YOUR reference object and raise
    # further if black/white discrimination still looks off.
    min_ref_saturation: 65.0
    saturation_full_confidence: 130.0
    # Same ramp, triggered by mean HSV value/brightness. Needed because
    # saturation=(max-min)/max is a RATIO: for dark pixels, small absolute
    # sensor noise gets amplified into a spuriously HIGH saturation
    # reading, so the saturation ramp alone can under-react to dark
    # objects (confirmed: a synthetic near-black pixel with only +-4/255
    # noise computed mean saturation ~50, above min_ref_saturation's
    # default). Overall color_confidence used is the MINIMUM of the
    # saturation ramp and this value ramp.
    min_ref_value: 50.0
    value_full_confidence: 160.0
    # Shrink each CANDIDATE box inward by this fraction of its own
    # width/height (each side) before sampling its color histogram -- e.g.
    # 0.15 keeps only the middle 70%x70% of the box. Unlike the reference
    # photos (masked by MobileSAM to pure object pixels), a video candidate
    # box has no per-candidate segmentation, so its rectangular edges/
    # corners commonly include background that dilutes the color
    # histogram -- hurts black/white discrimination specifically more than
    # colorful objects (background rarely shares a distinct HUE, but
    # commonly sits at a MID brightness that pulls both a black and a white
    # candidate's Value histogram toward each other). 0.0 = no-op.
    candidate_inset_ratio: 0.15

# ----------------------------------------------------------------------------
# STAGE 4 — Tracking between keyframes
# ----------------------------------------------------------------------------
stage4:
  tracker: builtin           # <<< "builtin" | "litetrack" | "cotracker3" | "none"
                             #   builtin   = OpenCV CSRT/KCF (no extra weights)
                             #   litetrack = LiteTrack-B4 ONNX (needs weights)
                             #   cotracker3 = CoTracker3 point-tracker, adapted to
                             #                a per-frame box (EXPERIMENTAL, see
                             #                aero_eyes/models/trackers.py's
                             #                CoTrackerTracker docstring)
                             #   none      = run detection on EVERY frame
  builtin:
    algorithm: csrt          # csrt | kcf | mosse
  cotracker3:
    # Experimental -- see aero_eyes/models/trackers.py's CoTrackerTracker
    # docstring for the windowed-recompute design and its trade-offs vs.
    # CoTracker's own true online mode. Needs CoTracker's own runtime
    # reachable via torch.hub.load("facebookresearch/co-tracker", variant).
    variant: cotracker3_offline
    device: auto
    grid_size: 5             # NxN query points sampled inside the box at (re-)init
    window_len: 16           # buffer cap before re-anchoring (bounds memory/compute)
    recompute_stride: 1      # re-run the model every Nth frame (1 = every frame)
    min_visible_ratio: 0.3   # fraction of grid points that must stay visible to trust the box
    outlier_trim_pct: 10.0   # trim this % (half each tail) of visible points before fitting the box
  litetrack:
    # Both REQUIRED if tracker=litetrack; else fail clearly. Real LiteTrack
    # inference is 2 separate graphs, not 1 -- see
    # aero_eyes/models/trackers.py module docstring. Export both from a
    # trained checkpoint (e.g. LiteTrack_ep0300.pth.tar) with
    # LiteTrack/tracking/export_litetrack_onnx.py.
    onnx_path_z: C:\Projects\LiteTrack\onnx_export\litetrack_B4_cae_center_all_ep300_z.onnx
    onnx_path_x: C:\Projects\LiteTrack\onnx_export\litetrack_B4_cae_center_all_ep300_x.onnx
    # Must match the exported checkpoint's own experiment yaml
    # (experiments/litetrack/*.yaml TEST.* / MODEL.BACKBONE.STRIDE).
    # Defaults below are LiteTrack's B4 config.
    template_size: 128
    search_size: 256
    template_factor: 2.0
    search_factor: 4.0
    stride: 16
  tracker_conf_threshold: 0.40   # τ: below this → re-detect immediately
  max_track_age: 30          # frames a track survives without re-detection

  # A single spurious "detect" (keyframe hit, or re-detect after track loss)
  # can spawn a tracker that survives up to max_track_age frames -- far
  # longer than stage5.min_tube_length can filter out. Matters most for
  # pipeline.detector=geco2, whose per-frame score is relative-only (see
  # scripts/check_geco2_score_separation.py) and so structurally cannot
  # express "target absent this frame". When enabled, a detect is not
  # trusted (tracker not (re)initialized) until `required_hits` consecutive
  # detect attempts agree spatially (IoU >= iou_threshold) -- attacks the
  # amplification directly, independent of whether the detector's raw score
  # separates present/absent. Off by default (does not change existing
  # runs); applies to both legacy and geco2 detectors (shared tracking loop).
  confirm_detections:
    enabled: false
    required_hits: 2
    iou_threshold: 0.3

  # A keyframe with ZERO surviving detections (GeCo2/Stage3 found nothing
  # there -- e.g. a single false-negative frame sandwiched between two
  # keyframes that BOTH detected the object) unconditionally kills an
  # already-active track by default: stage4.py never even calls
  # tracker.update() for that keyframe or any frame up to the NEXT one, so
  # the whole gap comes back absent even though the tracker's own state
  # (from the PRECEDING keyframe) might still be tracking correctly.
  # When enabled, a keyframe with no detection is treated like any other
  # non-keyframe frame WHENEVER a track is already active -- tracker.update()
  # runs as usual, still subject to every other check above (conf
  # threshold, max_track_age, kalman_motion_check, verify_interval +
  # absence_check), so a genuinely-departed object is still caught by
  # those; this only stops one missed DETECTION from overriding the
  # tracker's own live state. No effect when no track is active yet.
  keep_tracking_on_missed_keyframe:
    enabled: false
    # Tolerating a missed keyframe is only safe if the track being
    # extended through it was actually correct -- without a check, this
    # also lets an ALREADY-wrong track (locked onto a confuser earlier)
    # survive a missed keyframe that would otherwise have reset it.
    # Deliberately NOT cosine/appearance-based (domain gap + dynamic
    # prototype drift make that unreliable on this project's footage) --
    # instead, once the kept-through segment reaches the next INDEPENDENT
    # box (a real keyframe detection or successful re-detect), that box is
    # checked for motion-plausibility against a linear trend fitted from
    # the kept segment's OWN tracked positions (same method as
    # kalman_motion_check below, applied retroactively to one pending
    # segment). If implausible, the whole kept-through segment is
    # retroactively marked absent instead of keeping a likely-wrong track.
    # true (default whenever this feature is enabled) -- the safety net is
    # what makes tolerating a missed keyframe defensible in the first
    # place; false reproduces "always keep, never check" for comparison.
    validate_against_next_keyframe: true
    # Max CONSECUTIVE missed keyframes one open segment tolerates before
    # giving up on it -- deliberately separate from stage4.max_track_age
    # (track_age is frozen while a segment is open, so max_track_age can no
    # longer bound this; see KeepTrackingOnMissedKeyframeConfig's docstring).
    max_consecutive_missed_keyframes: 3
    window_frames: 10
    max_dist_ratio: 3.0
    # EXPERIMENTAL, opt-in secondary arbitration for the exact moment the
    # motion check above ALREADY flagged a disagreement -- same mechanism
    # as backward_tracking.validate_against_boundary.cosine_arbitration
    # below (see that block's comments for the full rationale/caveats).
    # Differs in ONE way: here the independent detection at the CURRENT
    # frame hasn't been written to tracks[] yet, so
    # override_boundary_on_win=true means REJECTING it for this one frame
    # (reports absent) instead of overwriting an already-recorded box --
    # the kept-through track itself keeps running untouched, and
    # kept_segment_start stays open for a later detection to resolve.
    cosine_arbitration:
      enabled: false
      override_boundary_on_win: false
      pooling: max
      use_adaptive_prototype: false

  # Recovers frames where the object was genuinely present but not yet
  # DETECTED -- an object entering the frame is often too degraded (motion
  # blur, partial visibility) for the detector to lock onto for the first
  # few keyframes, and the same shape of problem can happen mid-video after
  # a track-loss episode. Different from keep_tracking_on_missed_keyframe
  # above (which extends an ALREADY-active track through a gap): this
  # recovers frames BEFORE any track existed, by running a SEPARATE tracker
  # instance BACKWARD in time from the first confirmed box of each new
  # track segment (every re-lock, not just the video's first one). Stops as
  # soon as it hits whichever comes first: a frame already covered by a
  # PREVIOUS track segment, frame 0, max_backward_frames frames back, or
  # the backward tracker's own confidence (tracker_conf_threshold above)
  # dropping too low. No effect when tracker: none.
  backward_tracking:
    enabled: false
    max_backward_frames: 30
    # "stops at a frame already covered by a PREVIOUS track segment" above
    # means the backward run never OVERWRITES that frame's box -- but says
    # nothing about whether the backward segment it silently stitched onto
    # that boundary is actually the SAME object. If the backward tracker
    # drifted onto a confuser partway through, the recovered frames would
    # sit right next to a real, independent box (a real keyframe detection,
    # or the previous segment's own last frame) that may be far away.
    # When true, a BoxDriftCheck-style linear trend fit from the backward
    # segment's OWN recovered positions (same method as kalman_motion_check
    # / keep_tracking_on_missed_keyframe.validate_against_next_keyframe) is
    # checked against that boundary box the moment recovery reaches it; if
    # implausible, the ENTIRE backward-recovered segment is discarded
    # (reverts to absent) instead of being kept next to a real box it
    # disagrees with. false (default) = a recovered segment is always kept
    # once produced, unchanged from before this option existed.
    validate_against_boundary: false
    window_frames: 10
    max_dist_ratio: 3.0
    # EXPERIMENTAL, opt-in -- only consulted at the exact moment
    # validate_against_boundary's motion check ALREADY flagged a
    # disagreement (without this, that always means "discard the whole
    # backward segment"). Re-embeds BOTH the backward-tracked object and
    # the boundary object with DINOv2 and scores each against the SAME
    # prototype (the same signal verify_interval uses below); whichever
    # scores higher is treated as more likely the real target.
    # Deliberately off by default -- this project's own diagnostics
    # repeatedly found cosine poorly separated/domain-gap-sensitive on
    # this footage (see keep_tracking_on_missed_keyframe's own comment for
    # why THAT feature avoids cosine entirely). May make outcomes WORSE on
    # some videos -- A/B compare (e.g. via
    # scripts/check_stage_prf1_progression.py) before trusting it.
    cosine_arbitration:
      enabled: false
      # false: backward segment wins -> keep it, leave the boundary box
      #   untouched (both survive side by side).
      # true: backward segment wins -> ALSO discard the boundary box
      #   itself -- a stronger, riskier claim (overrides an independently-
      #   produced box, not just stops discarding the backward one).
      override_boundary_on_win: false
      # How a crop's score is combined across per_ref_features when
      # accuracy.cheap_boosters.multi_reference_embedding is active:
      #   mean         -- this function's original behavior (default,
      #                    unchanged -- stage4.verify_interval below also
      #                    relies on mean, so this default must not shift it).
      #   max          -- force max pooling regardless of Stage 3's own setting.
      #   match_stage3 -- read accuracy.cheap_boosters.multi_ref_pooling
      #                    directly, so arbitration scores things the SAME
      #                    way Stage 3's own matching did (recommended if
      #                    you run Stage 3 with multi_ref_pooling=max).
      pooling: max
      # false (default): score against ONLY the original 3 reference-photo
      #   vectors (prototype.npz from Stage 1, unaffected by Stage 3).
      # true: score against prototype_adapted.npz instead -- the SAME
      #   references PLUS whatever stage3.dynamic_prototype appended while
      #   matching this video (per_ref_features only ever grows via
      #   .append, so this is "original 3 + adaptive extras combined", not
      #   adaptive-only). Needs stage3.dynamic_prototype.enabled to have
      #   actually produced that file; falls back to prototype.npz (logged
      #   warning) if it's missing.
      use_adaptive_prototype: false

  # Every verify_interval frames of ACTIVE tracking (builtin/litetrack, not
  # tracker=none), re-embed the currently-tracked crop with DINOv2 and
  # cross-check it against the prototype -- the real correctness check
  # BuiltinTracker's own confidence cannot provide (it returns a fixed 0.9
  # placeholder on any OpenCV-reported success). If the re-embedded crop no
  # longer matches, forces a re-detect even though OpenCV still reports
  # tracking as nominally successful -- catches silent drift instead of
  # letting it persist for the full max_track_age.
  # Independent of confirm_detections above -- that guards against a single
  # SPURIOUS detection before a track ever starts; this guards against a
  # track that started fine but DRIFTED after the fact. Both can be on.
  # Needs prototype.npz (DINOv2): always present on the legacy pipeline; on
  # pipeline.detector=geco2 only when stage123_geco2.cosine_rescore.enabled
  # built one -- otherwise this silently has no effect (logged once).
  # 0 (default) = disabled, reproduces the original tracking logic exactly.
  verify_interval: 0

  # Refines what happens once verify_interval's cosine check above already
  # fails (sim < match_threshold): distinguishes "borderline/drifted, still
  # worth a re-detect attempt" from "similarity is far enough below
  # match_threshold the object has almost certainly left the frame -- don't
  # bother re-detecting". Without this, every verify_interval failure still
  # triggers a full re-detect attempt, which can succeed at finding SOME
  # box (via its own separate score, not cosine) even though the real
  # object is genuinely gone -- extending a post_departure_drift run
  # instead of ending it. Needs verify_interval > 0 to have any effect.
  absence_check:
    enabled: false
    # absence_threshold = match_threshold * absence_ratio. A ratio, not an
    # absolute cosine cutoff, since match_threshold itself can be adaptive
    # per video (stage3.adaptive_threshold). Lower = stricter (only the
    # most extreme mismatches skip re-detect); higher = more lenient (skips
    # re-detect more readily, risks giving up on a recoverable drift).
    absence_ratio: 0.5

  # pipeline.detector=geco2 only: GeCo2's own re-detect score is relative
  # per-frame (see scripts/check_geco2_score_separation.py), so it sometimes
  # locks onto a confuser instead of correctly reporting "not found" (shows
  # up as unrelated_false_positive runs in check_tracker_coverage.py). When
  # enabled, every GeCo2 re-detect additionally embeds each candidate box
  # with DINOv2 and drops any candidate whose cosine similarity to the
  # prototype falls below the SAME adaptive/fixed match_threshold Stage 3
  # used; the best-scoring GeCo2 box among the survivors wins (None if none
  # survive). No effect on the legacy pipeline, and no effect if
  # prototype.npz isn't available (same stage123_geco2.cosine_rescore
  # .enabled requirement as verify_interval above).
  # false (default) = disabled, GeCo2 re-detect behavior unchanged.
  geco2_redetect_cosine_filter: false

  # Cheap per-frame drift-plausibility check, complementary to
  # verify_interval's (appearance-based) cosine check above -- catches a
  # confuser that LOOKS similar enough to pass cosine but sits somewhere the
  # track's own recent trajectory couldn't plausibly have led to. Runs
  # EVERY frame of active tracking -- if it flags a frame, verify_interval's
  # own check for that frame is skipped (track_ok is already False by then).
  # See aero_eyes/utils/motion_drift_check.py and why this borrows
  # ByteTrack's core idea instead of its whole per-frame-detection
  # multi-object framework (this project tracks one object per video).
  #
  # v1 (single-step constant-velocity Kalman) was swept empirically
  # (scripts/sweep_kalman_max_dist_ratio.py) and found NET HARMFUL at every
  # ratio strict enough to trigger, on real footage with lots of genuine
  # frame-to-frame acceleration (drone camera + falling/tumbling objects) --
  # it mistook real motion for drift. v2 (current) fits a linear trend over
  # window_frames past positions instead of trusting just the previous
  # frame -- NOT yet validated the same way; re-sweep before trusting this.
  kalman_motion_check:
    enabled: false
    # How far (in units of the box's own diagonal) the center may land from
    # the fitted trend's prediction before being judged an implausible
    # departure from the track's own recent trajectory. Lower = stricter
    # (catches smaller departures, more false alarms on genuine fast/erratic
    # real motion).
    max_dist_ratio: 3.0
    # How many past frames the linear trend is fit over. Larger = smoother
    # (more resistant to single-frame noise, slower to notice a real
    # direction change); needs >=3 to fit a trend at all.
    window_frames: 10

# ----------------------------------------------------------------------------
# STAGE 5 — Spatio-temporal output
# ----------------------------------------------------------------------------
stage5:
  temporal_smoothing:
    enabled: true
    method: ema              # ema | none
    ema_alpha: 0.6
  min_tube_length: 2         # discard tubes shorter than this (frames)
  fill_short_gaps: 3         # linearly interpolate gaps <= this many frames

# ----------------------------------------------------------------------------
# BOX REFINE — sharpens an imprecise detection/tracking box to tightly fit
# the actual object silhouette, via a per-box segmentation pass. Addresses
# the "box not tight" (localization imprecision) part of ST-IoU loss (see
# scripts/check_st_iou_breakdown.py) -- distinct from stage4.verify_interval,
# which addresses tracking COVERAGE (a box that's simply missing), not
# precision. Disabled by default.
# ----------------------------------------------------------------------------
# IMPORTANT (measured on this project's 6 labeled samples, not just
# theoretical): whether ANY box_refine method helps or hurts ST-IoU depends
# on whether the ORIGINAL box already runs larger or smaller than its GT box
# on that particular video -- shrinking an already-undersized box makes it
# worse; shrinking an oversized one helps. There is no way to know that
# direction at real inference time (no GT then). See
# scripts/check_box_size_bias.py and check_box_refine_effect.py before
# trusting this on a new dataset -- method="sam" came out roughly
# NET-NEUTRAL averaged across this project's samples (helped 3, hurt 3).
box_refine:
  enabled: false
  # sam        -- MobileSAM prompted with a small CROP around the box.
  #               Empirically unreliable on small/low-res candidate boxes
  #               (as small as ~20x10px) -- crop is too tiny for SAM to
  #               segment consistently. Kept for comparison.
  # sam_dense  -- MobileSAM, but encodes the WHOLE frame ONCE (no crop) and
  #               reuses that embedding for every box on it -- same
  #               "encode once, reuse for every box" principle GeCo2's own
  #               SAM2-based sam_mask module uses on its dense backbone
  #               features (GeCo2's Hiera features aren't compatible with
  #               MobileSAM's SAM1-style decoder, so this re-encodes with
  #               MobileSAM's own encoder instead of needing a separate
  #               SAM2 checkpoint). Avoids "sam"'s small-crop problem;
  #               usually cheaper too when topk_per_keyframe > 1.
  # grabcut    -- classic OpenCV GrabCut seeded from the box. No model, no
  #               weights, much cheaper, noticeably lower quality than
  #               either SAM method.
  # sam2_dense -- GeCo2's OWN SAM2-based mask refinement
  #               (GECO2/models/sam_mask.py::MaskProcessor -- the same
  #               submodule CNT.forward calls internally but this pipeline's
  #               detect_frame() otherwise skips). Only usable when a GeCo2
  #               exemplar prototype cache exists (see
  #               stage123_geco2.prototype_cache_name). Refines using
  #               GeCo2's OWN dense Hiera features -- no crop/second
  #               encoder needed -- at the cost of one extra GeCo2 backbone
  #               pass per refined frame and a one-time ~300+MB download of
  #               Meta's public pretrained SAM2 checkpoint. Not yet
  #               benchmarked on this project's dataset the way "sam" was.
  # fastsam_dense -- FastSAM-s (stage2.fastsam_s weights) "segment
  #               everything" run ONCE per frame, then whichever
  #               already-produced instance mask best matches a given box
  #               (by IoU, or point-containment when
  #               use_center_point_prompt is on) is picked afterward -- see
  #               aero_eyes.models.segmentation.FastSAMSegmenter's own
  #               docstring. Unlike the SAM/SAM2 methods above, FastSAM has
  #               NO prompt-conditioned mask generation -- it can only
  #               SELECT among masks the everything-pass already produced,
  #               so it can't recover an object that wasn't cleanly its own
  #               instance there (merged with a neighbor, or missed
  #               outright -- a known FastSAM weak point on small objects).
  #               Not yet benchmarked -- compare with
  #               scripts/check_box_refine_effect.py before trusting it.
  method: sam                # "sam" | "sam_dense" | "grabcut" | "sam2_dense" | "fastsam_dense" | "sam2_native"
  # "sam"/"grabcut": padding kept around the box when CROPPING to segment.
  # "sam_dense": padding added to the box PROMPT itself before querying SAM
  #   -- without this, an undersized detector box rarely gets expanded back
  #   out even with min_iou_with_original=0.0 (SAM's decoder stays close to
  #   whatever box it's given). Also honored by "sam2_dense" via
  #   GeCo2Detector.sam2_refine_boxes's own wrapper (see its docstring) --
  #   0.0 (default) keeps that method's original, unexpanded box prompting.
  context_margin: 0.2
  # context_margin above is ONE flat value for every box -- but a large,
  # well-defined object (e.g. a motorbike) benefits from a generous margin,
  # while a tiny/ambiguous one (e.g. a helmet, ~15x10px) is more likely to
  # have that same margin sweep in a nearby confuser or background clutter
  # (confirmed in practice: context_margin=0.5 helped a motorbike sample a
  # lot but hurt a helmet sample's recall; 0.0 was better for helmet).
  # When enabled, the EFFECTIVE margin used for a box is context_margin
  # scaled by the box's own size (sqrt(w*h)) between min_size_px (-> margin
  # * min_ratio) and max_size_px (-> full context_margin), linearly
  # interpolated between -- so one context_margin value serves both small
  # and large objects instead of hand-picking a per-sample value. Applies
  # everywhere context_margin is used (sam/grabcut crop margin AND
  # sam_dense prompt-expansion margin).
  adaptive_context_margin:
    enabled: false
    min_size_px: 20.0   # box geometric-mean side (px) at/below which margin -> min_ratio
    max_size_px: 50.0  # box geometric-mean side (px) at/above which margin -> full context_margin
    min_ratio: 0.0       # fraction of context_margin used at/below min_size_px
    # min/max_size_px above compare a box against a FIXED absolute pixel
    # scale -- can't tell "genuinely tiny object" (shrink margin, correct)
    # apart from "this box badly undersizes an object that's normally
    # bigger in THIS SAME video" (shrink margin = exactly backwards, SAM
    # needs MORE room to reach the true boundary). When enabled, compares
    # each box instead against this sample's own median confident-detection
    # size for the same video; a box under relative_undersize_ratio of that
    # gets the FULL, unscaled context_margin instead of the shrink above --
    # a sample whose typical size is itself small is unaffected.
    relative_to_sample_median: false
    relative_undersize_ratio: 0.5
  # Affects method=sam/sam_dense (MobileSAM) AND sam2_dense (via
  # GeCo2Detector.sam2_refine_boxes's own wrapper -- see its docstring;
  # nothing inside GECO2/ itself is touched). Also passes the ORIGINAL
  # (pre-margin) box's own center to SAM as a positive point prompt,
  # alongside the (possibly margin-expanded) box prompt -- a bigger
  # context_margin gives SAM room to reach an undersized box's true
  # boundary, but also more background/confuser area it could latch onto
  # instead; the center point pins down which blob in that region is the
  # target, without needing to shrink the margin. Off by default: this
  # project's own reference-image segmentation (stage1.segmentation's
  # use_point_prompt) found a center point unreliable for ring/donut-shaped
  # objects (hollow center = background) -- only enable if none of your
  # tracked classes are shaped like that. Not yet benchmarked on this
  # project's own dataset -- compare with scripts/check_box_refine_effect.py
  # before trusting it.
  use_center_point_prompt: false
  # method=sam2_dense ONLY. GECO2's own MaskProcessor always takes a
  # HARD-CODED mask candidate (index 2 of the 4 SAM2 mask_decoder produces)
  # regardless of its own predicted-IoU score -- tuned for GECO2's own
  # counting-task validation, not necessarily best for refining an
  # arbitrary tracked box here. When true, picks whichever of the 3
  # multimask candidates SAM2 itself scored highest per box instead -- same
  # "trust the model's own confidence" principle sam_dense's own
  # scores.argmax() already uses. false (default) = GECO2's original
  # index-2 choice, unchanged. Not yet benchmarked -- compare with
  # scripts/check_box_refine_effect.py before trusting it.
  sam2_dense_select_best_mask: false
  # Reject a refined box whose IoU with the ORIGINAL (pre-refine) box falls
  # below this -- guards against the segmenter latching onto a sub-part,
  # a nearby confuser, or background clutter within the padded crop
  # instead of the intended object (confirmed in practice on small/low-res
  # candidate boxes). 0.0 = no sanity check.
  min_iou_with_original: 0.3
  # Refine the FINAL box Stage 3's cosine matching picked, once per
  # keyframe -- cheap (bounded by keyframe count x topk_per_keyframe).
  apply_in_stage3: true
  # ALSO refine periodically during Stage 4 tracking, piggybacked on the
  # SAME cadence as stage4.verify_interval (only takes effect when
  # stage4.verify_interval > 0) -- re-inits the tracker from the refined
  # box too. More expensive: runs during tracking, not just at keyframes.
  apply_in_stage4: false

# ----------------------------------------------------------------------------
# ACCURACY MODE — progressively enables domain-gap mitigations.
#   baseline       : single-scale, plain prototype
#   cheap_boosters : multi-scale scan + tuned NMS/thresh + multi-ref averaging
#   max_accuracy   : + synthetic viewpoint aug + CD-ViTO-style domain prompter
# Individual sub-toggles let each technique be ablated independently.
# ----------------------------------------------------------------------------
accuracy:
  mode: cheap_boosters             # baseline | cheap_boosters | max_accuracy

  cheap_boosters:
    multi_scale_scan: true
    scales: [0.75, 1.0, 1.5]
    tuned_nms: true
    multi_reference_embedding: true   # keep per-ref protos + ensemble match
    # How per-ref similarity scores get pooled into one, when
    # multi_reference_embedding is active. "mean" (default) averages across
    # all 3 refs -- a candidate matching only ONE ref well (e.g. object shot
    # from 3 different angles, candidate's own angle resembles just one of
    # them) gets that good score diluted by the other two weak ones. "max"
    # takes the single best-matching ref's score instead, so a genuinely
    # good match isn't dragged down by refs shot from a different angle.
    multi_ref_pooling: max   # "mean" | "max"

  max_accuracy:
    synthetic_viewpoint_aug:
      enabled: true
      method: homography     # homography | perspective_warp
      num_synth_views: 6
      pitch_range_deg: [40, 85]   # simulate top-down
      fold_into_prototype: true
    domain_prompter:
      enabled: true
      # CD-ViTO-style: synthesize "imaginary domain" feature shifts and
      # align candidate features toward the reference style.
      num_prompts: 4
      strength: 0.3

# ----------------------------------------------------------------------------
# EVALUATION (ST-IoU)
# ----------------------------------------------------------------------------
eval:
  metric: st_iou
  # Per-frame IoU averaged over the TEMPORAL UNION of pred & GT tubes;
  # frames present in only one tube contribute IoU = 0.
  spatial_iou_type: standard
  report_per_video: true
