# ============================================================================
# AERO EYES — Few-Shot Spatio-Temporal Drone Object Localization
# Master configuration. Every switch here is a real, documented option.
# Override any field via CLI: --set stage2.proposal_model=fastsam_s
# ============================================================================

project:
  name: aero_eyes
  # Where intermediate per-stage artifacts + final outputs are written.
  work_dir: ./runs/exp001
  # Re-use cached artifacts (e.g. prototype) instead of recomputing.
  use_cache: true
  seed: 42

# ----------------------------------------------------------------------------
# PIPELINE — which detector implementation runs Stage 1+2+3.
# ----------------------------------------------------------------------------
pipeline:
  detector: legacy   # <<< "legacy" (Stage1/2/3 separate) | "geco2" (single merged Stage123)
                     # Stage4/Stage5 run unchanged either way.

# ----------------------------------------------------------------------------
# DATA
# ----------------------------------------------------------------------------
data:
  # One sample = 3 reference images + 1 drone video (+ optional GT).
  # Layout: data_root/<sample_id>/object_images/ (or refs/) + *.mp4
  data_root: ./data
  refs_subdir: object_images
  video_glob: "*.mp4"
  num_references: 3

  # Ground-truth schema
  gt:
    global_file: "annotations (1).json"  # at project root, all videos
    box_format: xyxy          # confirmed: x1,y1,x2,y2 absolute pixels
    normalized: false
    frame_index_base: 0       # confirmed 0-based
    absent_encoding: omit     # confirmed: missing frames = absent
    one_object_per_video: true

  # Submission / output format
  submission:
    path_name: submission.json
    box_format: xyxy
    normalized: false
    frame_index_base: 0
    absent_encoding: omit

# ----------------------------------------------------------------------------
# RUNTIME
# ----------------------------------------------------------------------------
runtime:
  device: auto              # auto | cpu | cuda
  num_workers: 4
  batch_size: 16            # candidate-feature extraction batch
  log_level: INFO
  save_visualizations: true # overlays/heatmaps/annotated video per stage

# ----------------------------------------------------------------------------
# STAGE 1 — Reference processing (offline, runs once per target)
# ----------------------------------------------------------------------------
stage1:
  segmentation:
    enabled: true
    model: mobilesam         # mobilesam (background removal on refs)
    weights: null            # path to MobileSAM ckpt; null = auto-download
    fallback_if_missing: passthrough   # passthrough = skip masking, use full image
    min_area_frac: 0.05      # reject a mask smaller than this fraction of frame
    max_area_frac: 0.95      # reject a mask larger than this fraction of frame
    score_ratio_floor: 0.85  # prefer largest among masks scoring within this ratio of best
    max_border_touch_frac: 0.02 # reject mask touching image border > this fraction
    background_mode: mean_fill  # mean_fill | keep_real | blur
    blur_sigma: 25.0         # Gaussian sigma (px) used when background_mode == "blur"

  feature_extractor:
    model: dinov2            # dinov2 | dinov3 | clip | siglip | ensemble
    dinov2_variant: vitb14   # vits14 (384-d) | vitb14 (768-d) | vitl14 (1024-d) | vitg14 (1536-d)
    dinov3_variant: vitb16   # vits16 | vitb16 | vitl16 (gated on HF: facebook/dinov3-*)
    clip_variant: vit-b/32   # vit-b/32 (512-d) | vit-l/14 (768-d)
    siglip_variant: base     # base (768-d) | large (1024-d) | so400m (1152-d)
    weights: null            # null = load from torch.hub / hf
    image_size: 224

  prototype:
    fusion: mean             # mean | max | concat_then_pca
    l2_normalize: true
    cache_name: prototype.npz

  aerial_sim:
    enabled: false
    downscale_factor: 1.0    # e.g. 0.25 = shrink then re-upscale
    blur_ksize: 0            # Gaussian blur kernel size (px), 0 = off

# ----------------------------------------------------------------------------
# STAGE 2 — Candidate generation (per keyframe)
# ----------------------------------------------------------------------------
stage2:
  keyframe_interval: 8       # sample 1 keyframe every N frames

  sahi:
    use_sahi: true           # SAHI ON/OFF switch
    tile: [640, 640]
    overlap: 0.25

  proposal_model: yolov11n   # "yolov11n" | "fastsam_s" (YOLOv8 is NOT allowed)
  yolov11n:
    weights: yolo11n.pt      # ultralytics auto-downloads if absent
    conf: 0.05               # low: class-agnostic recall over precision
    iou: 0.5
    max_det: 300
    classes: null            # null = all classes
  fastsam_s:
    weights: FastSAM-s.pt
    conf: 0.2
    iou: 0.7
    imgsz: 640

  candidate:
    min_box_area: 16.0       # discard sub-pixel noise (px^2)
    max_candidates_per_keyframe: 400
    feature_crop_pad: 0.10   # pad each candidate crop before DINOv2

# ----------------------------------------------------------------------------
# STAGE 3 — Cross-domain matching
# ----------------------------------------------------------------------------
stage3:
  similarity: cosine         # cosine | l1 | l2
  match_threshold: 0.55      # fallback cutoff when adaptive_threshold is false
  nms_iou: 0.5               # NMS across overlapping SAHI tiles
  topk_per_keyframe: 5       # keep at most K detections per keyframe
  global_topk: null          # e.g. 30-100 to cap total surviving candidates across video
  adaptive_threshold: true   # threshold = mean(sim) + z_score * std(sim), floored at min_floor
  adaptive_z_score: 1.5      # swept via sweep_zscore_loocv.py (1.5 gives optimal generalization)
  adaptive_min_floor: 0.05   # hard floor: never accept similarity below this
  calibrate:
    enabled: false
    target_metric: st_iou
    search_range: [0.40, 0.75]
    steps: 8

# ----------------------------------------------------------------------------
# STAGE 1+2+3 REPLACEMENT — GeCo2 exemplar detector.
# Only used when pipeline.detector == "geco2". Produces detections.json for Stage 4/5.
# ----------------------------------------------------------------------------
stage123_geco2:
  repo_path: ./GECO2
  weights_path: ./GECO2/CNTQG_multitrain_ca44.pth
  segmentation:
    enabled: true
    model: mobilesam
    weights: null
    fallback_if_missing: passthrough
    min_area_frac: 0.05
    max_area_frac: 0.95
    score_ratio_floor: 0.85
    max_border_touch_frac: 0.02
    background_mode: mean_fill  # mean_fill | keep_real | blur
    blur_sigma: 25.0
  image_size: 1024
  emb_dim: 256
  kernel_dim: 3
  reduction: 16
  keyframe_interval: 8
  score_threshold_ratio: 0.33 # relative threshold vs frame's max score
  score_threshold_abs: 0.0   # absolute floor to detect target absence (calibrate via script)
  nms_iou: 0.5
  topk_per_keyframe: 5
  prototype_cache_name: geco2_prototype.pt
  ref_downscale_factor: 1.0

  scale_calibration:
    enabled: false
    expected_object_px: null # [width, height] in raw video frame px (e.g. [22, 18])
    context_margin: 0.5

  domain_calibration:
    enabled: false
    num_sample_frames: 5     # frames sampled to estimate video domain
    strength: 1.0            # 0 = off, 1 = fully align to video domain mean token

# ----------------------------------------------------------------------------
# STAGE 4 — Tracking between keyframes
# ----------------------------------------------------------------------------
stage4:
  tracker: builtin           # "builtin" | "litetrack" | "none"
  builtin:
    algorithm: csrt          # csrt | kcf | mosse (auto-falls back to mil if missing)
  litetrack:
    onnx_path: null          # required if tracker=litetrack
    input_size: 256
  tracker_conf_threshold: 0.40
  max_track_age: 30
  verify_interval: 5         # re-embed crop every N frames with DINOv2; 0 to disable
  confirm_detections:
    enabled: false           # require N consecutive agreeing detections before (re)init tracker
    required_hits: 2
    iou_threshold: 0.3

# ----------------------------------------------------------------------------
# STAGE 5 — Spatio-temporal output
# ----------------------------------------------------------------------------
stage5:
  temporal_smoothing:
    enabled: true
    method: ema              # ema | none
    ema_alpha: 0.6
  min_tube_length: 2         # discard tubes shorter than N frames
  fill_short_gaps: 3         # linearly interpolate gaps <= N frames

# ----------------------------------------------------------------------------
# ACCURACY MODE — domain-gap mitigations.
# ----------------------------------------------------------------------------
accuracy:
  mode: baseline             # baseline | cheap_boosters | max_accuracy

  cheap_boosters:
    multi_scale_scan: true
    scales: [0.75, 1.0, 1.5]
    tuned_nms: true
    multi_reference_embedding: true

  max_accuracy:
    synthetic_viewpoint_aug:
      enabled: true
      method: homography     # homography | perspective_warp
      num_synth_views: 6
      pitch_range_deg: [40, 85]
      fold_into_prototype: true
    domain_prompter:
      enabled: true
      num_prompts: 4
      strength: 0.3

# ----------------------------------------------------------------------------
# EVALUATION (ST-IoU)
# ----------------------------------------------------------------------------
eval:
  metric: st_iou
  spatial_iou_type: standard
  report_per_video: true