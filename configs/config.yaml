# ============================================================================
# AERO EYES — Few-Shot Spatio-Temporal Drone Object Localization
# Master configuration. Every switch here is a real, documented option.
# Override any field via CLI: --set proposal_model=fastsam_s
# ============================================================================

project:
  name: aero_eyes
  # Where intermediate per-stage artifacts + final outputs are written.
  work_dir: ./runs/exp001
  # Re-use cached artifacts (e.g. prototype) instead of recomputing.
  use_cache: true
  seed: 42

# ----------------------------------------------------------------------------
# PIPELINE — which detector implementation runs Stage 1+2+3.
# ----------------------------------------------------------------------------
pipeline:
  detector: legacy   # <<< "legacy" (Stage1/2/3, this file's stage1/stage2/stage3
                      #     sections) | "geco2" (single merged stage using the
                      #     vendored GECO2/ few-shot exemplar detector instead
                      #     -- see the stage123_geco2 section below).
                      # Stage4/Stage5 run unchanged either way.

# ----------------------------------------------------------------------------
# DATA  —  CONFIRM THIS LAYOUT WITH THE USER BEFORE WRITING CODE.
# These are PLACEHOLDER assumptions; the real schema must be verified.
# ----------------------------------------------------------------------------
data:
  # One sample = 3 reference images + 1 drone video (+ optional GT).
  # Confirmed layout (aero-eyes-dataset / PublicTest / samples):
  #   data_root/
  #     <sample_id>/
  #       object_images/   img_1.jpg img_2.jpg img_3.jpg
  #       drone_video.mp4  (any *.mp4 name — video_glob matches by extension)
  data_root: ./data
  refs_subdir: object_images
  video_glob: "*.mp4"
  num_references: 3

  # Ground-truth schema — confirmed by user.
  # Single global annotations file at project root; filter by video_id.
  gt:
    global_file: "annotations (1).json"  # at project root, all videos
    box_format: xyxy          # confirmed: x1,y1,x2,y2 absolute pixels
    normalized: false
    frame_index_base: 0       # confirmed 0-based
    absent_encoding: omit     # confirmed: missing frames = absent
    one_object_per_video: true

  # Submission / output format — confirmed same schema as GT.
  submission:
    path_name: submission.json
    box_format: xyxy
    normalized: false
    frame_index_base: 0
    absent_encoding: omit

# ----------------------------------------------------------------------------
# RUNTIME
# ----------------------------------------------------------------------------
runtime:
  device: auto              # auto | cpu | cuda
  # Jetson/TensorRT explicitly OUT OF SCOPE. CPU/GPU portable only.
  num_workers: 4
  batch_size: 16            # candidate-feature extraction batch
  log_level: INFO
  save_visualizations: true # overlays/heatmaps/annotated video per stage

# ----------------------------------------------------------------------------
# STAGE 1 — Reference processing (offline, runs once per target)
# ----------------------------------------------------------------------------
stage1:
  segmentation:
    enabled: true
    model: mobilesam         # mobilesam  (background removal on refs)
    weights: null            # path to MobileSAM ckpt; null = auto-download
    fallback_if_missing: passthrough   # passthrough = skip masking, use full image
    # What to do with the non-mask (background) region of a reference image:
    #   mean_fill (default) -- flat mean-color fill.
    #   keep_real -- leave the reference photo's real background untouched.
    #   blur -- strong Gaussian blur of the real background.
    background_mode: mean_fill   # mean_fill | keep_real | blur
    blur_sigma: 25.0             # used when background_mode: blur
  # Crop each reference image to its MobileSAM tight mask box (expanded by
  # crop_context_margin) BEFORE resizing to feature_extractor.image_size --
  # keeps 100% real pixels, just a tighter field of view than the whole
  # photo, so the object occupies a larger fraction of the final canvas.
  # Requires segmentation.enabled. Off by default.
  crop_to_object: false
  crop_context_margin: 0.5
  feature_extractor:
    model: dinov2            # dinov2 | dinov3 | clip | siglip | ensemble (dinov2+clip concat)
    dinov2_variant: vitb14   # vits14 (~22M, 384-d) | vitb14 (~86M, 768-d) | vitl14 (~300M, 1024-d) | vitg14 (~1.1B, 1536-d)
                              # larger variants = stronger features but much slower/heavier; vitl14 is a reasonable next step to try
    # dinov3_variant: used only when model=dinov3. Weights are GATED on
    # HuggingFace (facebook/dinov3-*-pretrain-lvd1689m) -- request access on
    # the model page with your HF account first, then set HF_TOKEN in the
    # environment before running, or the download will 401/403.
    dinov3_variant: vitb16   # vits16 (384-d) | vitb16 (768-d) | vitl16 (1024-d)
    clip_variant: vit-b/32   # vit-b/32 (512-d) | vit-l/14 (768-d)
    # siglip_variant: used only when model=siglip. Open access on HuggingFace,
    # no token needed. Vision encoder only (no text tower loaded).
    siglip_variant: base     # base (768-d) | large (1024-d) | so400m (1152-d, slow)
    weights: null            # null = load from torch.hub / hf
    image_size: 224
  prototype:
    # How the 3 per-reference feature sets are fused.
    fusion: mean             # mean | max | concat_then_pca
    l2_normalize: true
    cache_name: prototype.npz
  # Degrade reference images (shrink-then-upscale + optional blur) to look
  # more like a distant aerial capture before feature extraction -- shrinks
  # the domain gap between crisp close-up references and the drone's
  # actual view of the object. Both no-ops at their default values.
  aerial_sim:
    enabled: false
    downscale_factor: 1.0   # e.g. 0.5 = shrink to half then upscale back
    blur_ksize: 0            # Gaussian blur kernel size in px, 0 = off
  # DINOv2 analog of stage123_geco2.domain_calibration: shifts the fused
  # prototype (and each per-ref vector, when multi_reference_embedding is
  # active) toward the mean DINOv2 embedding of a few RAW frames sampled
  # from the query video -- an estimate of this video's own general scene/
  # lighting domain (color temperature, exposure, compression, motion
  # blur), independent of where the target object is in those frames.
  # Different from -- and can be combined with -- stage3.dynamic_prototype,
  # which shifts toward matched CANDIDATE CROPS (object-focused, but only
  # available once matching has already found plausible hits) instead of
  # whole frames (background-heavy, but available immediately).
  domain_calibration:
    enabled: false
    num_sample_frames: 5
    strength: 0.3   # 0 = no change, 1 = fully replaced by the video's own mean embedding

# ----------------------------------------------------------------------------
# STAGE 2 — Candidate generation (per keyframe)
# ----------------------------------------------------------------------------
stage2:
  keyframe_interval: 8       # sample 1 keyframe every N frames (5–10 typical)

  sahi:
    use_sahi: true           # <<< SAHI ON/OFF SWITCH
    tile: [640, 640]
    overlap: 0.25            # fraction
    # If false: run the proposal model on the full (resized) frame instead.

  proposal_model: yolov11n   # <<< "yolov11n"  |  "fastsam_s"  (pick exactly ONE)
                             #     YOLOv8 is explicitly NOT allowed.
  yolov11n:
    weights: yolo11n.pt      # ultralytics auto-downloads if absent
    conf: 0.05               # low: class-agnostic recall over precision
    iou: 0.5
    max_det: 300
    classes: null            # null = all classes (class-agnostic use)
  fastsam_s:
    weights: FastSAM-s.pt    # ultralytics auto-downloads if absent
    conf: 0.2
    iou: 0.7
    imgsz: 640

  candidate:
    min_box_area: 16         # discard sub-pixel noise (px^2)
    max_candidates_per_keyframe: 400
    feature_crop_pad: 0.10   # pad each candidate crop before DINOv2

# ----------------------------------------------------------------------------
# STAGE 3 — Cross-domain matching
# ----------------------------------------------------------------------------
stage3:
  similarity: cosine         # cosine | l1 | l2  (l1/l2 = negated distance, higher still = more similar)
  match_threshold: 0.55      # calibratable; candidates below are dropped (used unless adaptive_threshold below)
  nms_iou: 0.5               # NMS across overlapping SAHI tiles
  topk_per_keyframe: 5       # keep at most K detections per keyframe
  # global_topk: cap the number of surviving candidates across the WHOLE video
  # (applied AFTER threshold filtering). null = no cap. Useful when the ground-
  # to-aerial domain gap pushes the whole similarity distribution down and a
  # fixed threshold alone lets too much noise through.
  global_topk: null          # e.g. 30-100 when domain gap is large
  # adaptive_threshold: instead of a fixed match_threshold, compute
  # per-video threshold = mean(sim) + adaptive_z_score * std(sim), floored at
  # adaptive_min_floor. Robust when the tiny top-down object's absolute
  # similarity to the close-up reference is unpredictable video to video.
  adaptive_threshold: false
  # adaptive_z_score: higher = fewer false positives, lower = more recall.
  # Empirically swept on the aero-eyes-dataset PublicTest samples (DINOv2 +
  # cheap_boosters): z=1.0->0.269, 1.5->0.312, 2.0->0.338 (best), 2.5->0.332,
  # 3.0->0.268 mean ST-IoU. 2.0 is the validated default for this dataset —
  # re-sweep if the domain gap or dataset changes.
  adaptive_z_score: 2.0
  adaptive_min_floor: 0.05   # hard floor: never accept sim below this even if adaptive
  # Optional auto-calibration of match_threshold on a labelled subset.
  calibrate:
    enabled: false
    target_metric: st_iou
    search_range: [0.40, 0.75]
    steps: 8
  # Optional 2-pass matching: after the initial similarity pass, pick
  # candidates scoring above an ADAPTIVE (percentile-of-THIS-sample)
  # threshold instead of a fixed cutoff -- a fixed cutoff only ever fires
  # for "easy" targets whose scores are already high; a "hard" target's
  # scores may never clear it, so the mechanism silently never activates.
  # Blends those high-confidence candidates' mean feature into the
  # prototype and re-scores, repeated for `rounds` passes so the prototype
  # drifts toward this specific video's own appearance of the target.
  # Disabled by default -- leaves single-pass matching above unchanged.
  dynamic_prototype:
    enabled: false
    rounds: 2
    alpha: 0.3                    # blend weight of the new high-confidence mean feature into the prototype
    high_conf_percentile: 90.0    # percentile of THIS sample's own score distribution
    high_conf_abs_floor: 0.15     # absolute floor, so a low-scoring sample doesn't update from noise
    min_support: 2                # minimum high-confidence candidates required to update; else stop early

# ----------------------------------------------------------------------------
# STAGE 1+2+3 REPLACEMENT — GeCo2 exemplar detector.
# Only used when pipeline.detector == "geco2". Ignores stage1/stage2/stage3
# above entirely; still produces detections.json for Stage 4/5 to consume.
#
# GeCo2 is a single-image few-shot detector: its exemplar boxes normally
# live INSIDE the image being detected on. aero_eyes' 3 reference images are
# separate photos, so each is treated as its own exemplar box = the whole
# image (they're already close-up crops of the target) and encoded
# independently; see aero_eyes/models/geco2_detector.py for the full
# rationale. No SAHI tiling / multi-scale scan is applied on the query
# frame here (accuracy.mode boosters below don't apply to this path) —
# very small objects may need a smaller keyframe crop for good recall.
#
# Requires: the vendored GECO2/ repo's own deps (hydra-core, omegaconf,
# iopath, its bundled sam2 package -- see GECO2/install.sh) installed, and
# CNTQG_multitrain_ca44.pth downloaded into weights_path (see GECO2/README.md).
# ----------------------------------------------------------------------------
stage123_geco2:
  repo_path: ./GECO2
  weights_path: ./GECO2/CNTQG_multitrain_ca44.pth
  # Same MobileSAM foreground masking as stage1.segmentation (background
  # filled with the ref image's own mean color) -- applied before
  # ref_downscale_factor below. Same fields/defaults as stage1.segmentation.
  segmentation:
    enabled: true
    model: mobilesam
    weights: null
    fallback_if_missing: passthrough
    min_area_frac: 0.05    # reject a mask smaller than this fraction of the frame
    max_area_frac: 0.95    # reject a mask larger than this fraction of the frame
    # Of SAM's 3 candidate masks, only ones scoring within this ratio of the
    # best score are eligible for the "prefer largest" pick -- raise toward
    # 1.0 if masks are still bleeding into background (over-segmenting);
    # lower toward 0.0 if masks are still cutting off part of the object
    # (under-segmenting).
    score_ratio_floor: 0.85
    # Reject a candidate whose mask touches the real image border more than
    # this fraction of edge pixels (box prompt is inset 5% from the edges,
    # so a correctly-segmented subject essentially never reaches it; a
    # background plane commonly runs off-frame). Raise if legitimate subjects
    # in your reference photos are shot edge-to-edge with no margin.
    max_border_touch_frac: 0.02
    # Center-point prompt (in addition to the box prompt) assumes the
    # geometric center pixel is foreground -- breaks down for ring/donut-
    # shaped objects (e.g. a life ring) whose center is a HOLLOW interior
    # (background), which can bias SAM's mask proposals toward confused/
    # leaky boundaries (confirmed empirically: life-ring reference photos
    # showed both border-touching passthrough failures AND loose/over-
    # inclusive masks on the candidate that WAS accepted). Set false to
    # prompt with the box alone for object shapes like this.
    use_point_prompt: true
    # What to do with the non-mask (background) region of a reference image:
    #   mean_fill (default) -- flat mean-color fill. Cheapest, but a large
    #     flat, textureless region is far outside what the backbone
    #     (pretrained on natural photos) ever saw -- can push the exemplar
    #     token into an unnatural part of feature space.
    #   keep_real -- leave the reference photo's real background untouched
    #     (mask still controls the RoI-Align box, just not the pixels).
    #   blur -- strong Gaussian blur of the real background: keeps natural
    #     color/texture statistics, discards fine background detail.
    background_mode: keep_real
    blur_sigma: 25.0   # used when background_mode: blur
    # When the segmenter's own mask area ratio falls outside
    # [min_valid_mask_ratio, max_valid_mask_ratio], replace it with a safe
    # rectangular center-crop mask (center_fallback_ratio of the frame)
    # instead of passing the implausible mask straight through -- an
    # almost-empty mask is likely pure noise; an almost-full mask is
    # effectively a whole-image passthrough that lets background bleed
    # straight into the exemplar and corrupts matching downstream.
    # Reference photos are always close-up shots with the target centered,
    # so a center-crop is a reasonable stand-in for "the object" either way.
    # Off by default -- does not change existing runs unless opted in.
    center_crop_fallback: false
    min_valid_mask_ratio: 0.03
    max_valid_mask_ratio: 0.92
    center_fallback_ratio: 0.75
  image_size: 1024
  emb_dim: 256
  kernel_dim: 3
  reduction: 16
  keyframe_interval: 8       # same meaning as stage2.keyframe_interval
  # Per-frame relative threshold: keep detections with score >
  # box_v.max() * score_threshold_ratio. GeCo2's raw score is not
  # comparable across frames/videos, so (unlike stage3.match_threshold)
  # this can't be a fixed absolute cutoff. 0.33 mirrors GECO2/demo_gradio.py's
  # default threshold slider value.
  score_threshold_ratio: 0.33
  # Absolute floor on a frame's OWN max score, independent of the ratio
  # above -- GeCo2 was trained on FSC147 where every image guarantees an
  # instance of the counted class, so score_threshold_ratio ALONE can never
  # express "target absent this frame" (it always keeps >=1 box whenever
  # max score > 0). If a frame's peak score doesn't clear this floor, no
  # boxes are returned for that frame at all. 0.0 = disabled (old behavior).
  # DO NOT guess this value -- run scripts/check_geco2_score_separation.py
  # on your own present/absent-labeled frames first, then set it just above
  # the highest score seen on a genuinely "absent" frame (with margin).
  score_threshold_abs: 0.0
  nms_iou: 0.5
  topk_per_keyframe: 5
  prototype_cache_name: geco2_prototype.pt   # cached exemplar tokens (torch, not prototype.npz)

  # --------------------------------------------------------------------
  # Optional alternative to score_threshold_ratio/score_threshold_abs above:
  # a keyframe with no real target still has a "best" box by construction
  # (per-frame-relative thresholding), so across a whole video that means
  # stray boxes on every empty frame. Instead: pool raw scores across EVERY
  # keyframe in the whole video first, then compute ONE global threshold =
  # max(abs_floor, mean + z_score*std) over that pooled distribution
  # (capped at the video's own observed max) -- same style of fix as
  # stage3.adaptive_threshold, applied to GeCo2's own score. Costs a second
  # pass over the video's keyframes, but reuses each frame's already-
  # computed raw backbone output, so it does NOT double GeCo2 forward
  # passes. Disabled by default. Only applies when
  # stage123_geco2.cosine_rescore.enabled is false (that path's own Stage 3
  # cosine matching decides the final threshold instead).
  # --------------------------------------------------------------------
  global_adaptive_threshold:
    enabled: false
    z_score: 1.0
    abs_floor: 0.15

  # --------------------------------------------------------------------
  # Optional extra matching pass inserted between GeCo2 detection and
  # Stage 4 tracking. When enabled, GeCo2 no longer decides detections.json
  # alone: it first produces a WIDER per-keyframe candidate set (using
  # candidate_score_threshold_ratio/candidate_topk_per_keyframe below
  # instead of score_threshold_ratio/topk_per_keyframe above), each
  # candidate crop is embedded with a SEPARATE DINOv2 prototype (built the
  # same way stage1 above does, from the same 3 reference images -- an
  # independent signal from a different backbone than GeCo2's own Hiera),
  # and stage3's cosine matching (+ stage3.dynamic_prototype, if enabled)
  # does the actual threshold/NMS/top-K filtering that writes
  # detections.json. Stage 3 and Stage 4 then run as one merged step
  # (aero_eyes/stages/stage34.py) so a --from-stage resume can never run
  # tracking against a stale/missing detections.json.
  # Disabled by default -- GeCo2 alone decides detections.json, unchanged.
  # --------------------------------------------------------------------
  cosine_rescore:
    enabled: false
    # Looser than score_threshold_ratio/topk_per_keyframe above -- this
    # stage only needs to not throw away the true positive; stage3's
    # cosine matching does the real cut.
    candidate_score_threshold_ratio: 0.15
    candidate_topk_per_keyframe: 15
  # Shrink each ref image before encoding as an exemplar, to narrow the
  # ground-to-aerial domain gap (close-up ref photos are otherwise much
  # crisper/larger-looking than the object as it actually appears in the
  # drone video). 1.0 = no-op (default). The shrunk image still gets
  # upscaled back up to image_size by resize_and_pad -- so the effective
  # blur depends on shrunk-size vs image_size, not just this factor alone
  # (a given factor blurs a low-res ref photo far more than a high-res one).
  # NOTE: proven a no-op on the object's final SIZE on the model's canvas --
  # resize_and_pad always re-normalizes the whole image's longer side back
  # to image_size regardless of any uniform pre-shrink, so this only affects
  # blur/detail. Use scale_calibration below to fix apparent-size mismatch.
  ref_downscale_factor: 1.0   # e.g. 0.125 = resize down to 1/8 size
  # Crop each ref image to its MobileSAM tight mask box (expanded by
  # crop_context_margin) BEFORE resize_and_pad -- keeps 100% real pixels, no
  # masking/fill (unlike background_mode above), just a tighter field of
  # view than the whole reference photo. Since resize_and_pad always
  # renormalizes the (now smaller) image's longer side back up to
  # image_size, the object ends up occupying a LARGER fraction of the 1024
  # canvas -- RoI-Align pools from more feature-map cells, higher-resolution
  # appearance token. Unlike scale_calibration below, needs NO oracle
  # knowledge of the deployment video's apparent object size -- purely a
  # function of the reference photo's own object bounds. Requires
  # segmentation.enabled.
  crop_to_object: false
  crop_context_margin: 0.5   # extra padding around the tight box, as a fraction of the box's own size

  # --------------------------------------------------------------------
  # Fixes the ground-to-aerial SIZE mismatch ref_downscale_factor cannot
  # fix (see note above): builds a synthetic canvas per reference image,
  # centered on the MobileSAM tight mask box, sized so the object occupies
  # the same fraction of the canvas as it's expected to occupy in the query
  # video frame after ITS OWN resize_and_pad. Requires segmentation.enabled
  # (needs the tight mask box). See
  # aero_eyes/stages/stage123_geco2.py::_build_scale_calibrated_canvas.
  # --------------------------------------------------------------------
  scale_calibration:
    enabled: false
    # Expected apparent size(s) [width, height] in pixels of the object AS
    # IT APPEARS IN THE RAW VIDEO FRAME (before any resize/pad) -- estimate
    # from flight altitude/GSD, or eyeball it on a sample frame. Required
    # when enabled: true -- do NOT guess a value blind, a wrong estimate
    # actively hurts (recreates the same kind of scale mismatch this exists
    # to remove, just in a different direction).
    # Accepts a single [w, h] pair (shorthand for one scale, e.g. [22, 18])
    # OR a list of pairs to hedge across several plausible apparent sizes,
    # e.g. [[18, 15], [26, 22], [34, 29]] -- see multi_scale_mode below for
    # how more than one scale is actually used.
    expected_object_px: null
    # "first" (default): only expected_object_px[0] is used -- one
    #   calibrated canvas per reference image, unchanged from before this
    #   option existed.
    # "all": one calibrated canvas per (reference image, scale) pair, each
    #   fed into GeCo2 as its own exemplar entry -- own appearance token
    #   AND (when use_shape_token: true) own shape token per scale. Costs
    #   num_refs*num_scales backbone passes instead of num_refs.
    multi_scale_mode: first   # "first" | "all"
    # Extra padding kept around the tight mask box, as a fraction of the
    # object's own size, before that (object+margin) footprint is
    # calibrated to expected_object_px -- gives the model a bit of
    # surrounding context instead of the object filling the canvas
    # edge-to-edge.
    context_margin: 0.5

  # --------------------------------------------------------------------
  # Shifts exemplar APPEARANCE tokens (not shape tokens) toward the
  # feature-space region the backbone actually produces for THIS video's
  # own frames. Even with correct scale + a natural background
  # (segmentation.background_mode != mean_fill), encoding the reference
  # photo and the query frame are two independent backbone forward passes
  # with two different self-attention contexts -- this corrects the
  # resulting systematic token-statistics gap, independent of the object's
  # true appearance. See GeCo2Detector.estimate_domain_shift /
  # calibrate_prototype.
  # --------------------------------------------------------------------
  domain_calibration:
    enabled: false
    num_sample_frames: 5   # unlabeled video frames sampled to estimate "this video's own domain"
    strength: 1.0           # 0 = no change, 1 = fully match the video's own mean token

  # --------------------------------------------------------------------
  # DIAGNOSTIC/ABLATION: box size feeds the exemplar prototype through TWO
  # independent paths -- (1) shape_or_objectness(w,h) -> a dedicated shape
  # token, and (2) the box coordinates that define the RoI-Align pooling
  # REGION for the appearance token (main/l1/l2). use_shape_token: false
  # disables ONLY path (1) -- it does NOT fix path (2) (a wrong-scaled box
  # still pools the wrong region for appearance either way). Combine with
  # scale_calibration.enabled to isolate which path matters:
  #   true,  scale_calibration=false -- current default (both paths "wrong")
  #   false, scale_calibration=false -- isolates path (1) alone
  #   true,  scale_calibration=true  -- both paths fixed
  #   false, scale_calibration=true  -- path (2) fixed, path (1) removed entirely
  # --------------------------------------------------------------------
  use_shape_token: true

  # --------------------------------------------------------------------
  # Cheap post-detection filter for GeCo2's blind spot: it's a few-shot
  # COUNTING model matching shape/texture via its vision backbone -- no
  # explicit color signal, so same-silhouette-different-color objects are
  # a common false positive. Compares each candidate box against the
  # reference object's own color signature (built once from the
  # MobileSAM-masked reference photos, cached to color_signature.npz).
  # Pure OpenCV, no extra model, no finetuning. Falls back to the WHOLE
  # reference photo's color (diluted by background) if
  # segmentation.enabled=false.
  #
  # TWO signals are blended by color_confidence:
  #   - Hue+Saturation histogram (brightness ignored -- robust to lighting
  #     differences between the reference photo and the video frame) --
  #     reliable for colorful objects, but Hue is unstable/noisy for
  #     near-achromatic (black/white/gray) ones.
  #   - Value/brightness histogram -- the ONE property that reliably
  #     separates black from white/gray, exactly where Hue+Saturation
  #     carries no signal. More lighting-sensitive, so down-weighted for
  #     colorful objects (see saturation_value_confidence in
  #     aero_eyes/utils/color.py).
  # effective_similarity = confidence*sim_hue_sat + (1-confidence)*sim_value
  #
  # EMPIRICALLY CONFIRMED (not just theoretical), in this order: (1) a
  # black-ish reference object (mean saturation=60.1, value=121.3) saw
  # ST-IoU DROP even with a correctly-sized histogram (0.4264 -> 0.3902)
  # using Hue+Saturation alone; (2) Value was blended in specifically
  # because, even after that fix, the detector still visibly confused a
  # similarly-shaped WHITE object in the output video -- Hue+Saturation
  # structurally cannot catch that (both black and white can have
  # arbitrary/unstable Hue), only Value can.
  # --------------------------------------------------------------------
  color_postfilter:
    enabled: false
    # Deliberately COARSE (not the ~30x32 "whole photo" tutorial default):
    # candidate crops here can be as small as ~20x10px (~200 pixels).
    # EMPIRICALLY CONFIRMED: a 960-bin (30x32) histogram from that few
    # pixels is severely under-sampled -- even a GENUINELY correct-color
    # match only scored ~0.49 similarity (barely above min_similarity's
    # default floor, easily pushed below it by real-world noise), while
    # 12x8=96 bins scored ~0.83 on the identical case, with NO loss of
    # discrimination against a truly different color (both scored ~0.0).
    # This was the actual root cause of a catastrophic real-world failure
    # (ST-IoU 0.4264 -> 0.0094, detected frames dropped ~75%) before this
    # default was lowered. Re-validate with your own crop sizes if raised.
    hue_bins: 12
    sat_bins: 8
    value_bins: 8   # for the separate Value-only histogram, same small-crop reasoning
    metric: bhattacharyya   # bhattacharyya | correlation
    # Candidates scoring below this similarity (~0..1, higher=more similar)
    # against EVERY reference photo are dropped outright. This is the ONLY
    # mechanism that should filter by color -- see reweight below for why
    # letting color CHANGE surviving candidates' scores is dangerous.
    # 0.0 = color_postfilter becomes a pure no-op.
    min_similarity: 0.3
    # DEFAULT FALSE -- EMPIRICALLY CONFIRMED HARMFUL, not just theoretical.
    # aero_eyes/stages/stage4.py picks the keyframe candidate to
    # (re)initialize the tracker from via `max(dets, key=lambda d:
    # d.similarity)` -- i.e. it re-runs argmax over exactly this score, so
    # reweighting by a noisy signal (Value/brightness is lighting-sensitive)
    # can flip WHICH candidate wins even when NOTHING is ever hard-dropped,
    # silently swapping in a wrong box that then persists via tracking for
    # up to max_track_age frames. Confirmed on real data: reweight=true
    # with min_similarity=0.0 (no hard-drop -- identical candidate sets
    # survive as min_similarity=0.3) produced the exact same degraded
    # ST-IoU as min_similarity=0.3, proving 100% of the harm was the score
    # multiplication itself. Leave false; let min_similarity above be the
    # only thing that changes which candidates survive.
    reweight: false
    # Blend ramp (NOT a hard on/off cutoff): below min_ref_saturation,
    # color_confidence=0 (100% Value-based comparison); at/above
    # saturation_full_confidence, confidence=1 (100% Hue+Saturation);
    # linearly interpolated in between. mean saturation = 0-255, over the
    # masked object pixels, averaged across all 3 ref photos.
    # 65.0 (not the naive-looking 40.0): a real black reference object in
    # this codebase's own test data measured mean_saturation=60.1 (S is a
    # ratio, so sensor noise on dark pixels inflates it) -- with a 40.0
    # floor that still leaked ~22% confidence onto Hue+Saturation (unreliable
    # for dark objects) instead of relying on Value as intended. 65.0 sits
    # just above that observed noise floor. Check the mean_saturation
    # build_color_signature logs for YOUR reference object and raise
    # further if black/white discrimination still looks off.
    min_ref_saturation: 65.0
    saturation_full_confidence: 130.0
    # Same ramp, triggered by mean HSV value/brightness. Needed because
    # saturation=(max-min)/max is a RATIO: for dark pixels, small absolute
    # sensor noise gets amplified into a spuriously HIGH saturation
    # reading, so the saturation ramp alone can under-react to dark
    # objects (confirmed: a synthetic near-black pixel with only +-4/255
    # noise computed mean saturation ~50, above min_ref_saturation's
    # default). Overall color_confidence used is the MINIMUM of the
    # saturation ramp and this value ramp.
    min_ref_value: 50.0
    value_full_confidence: 160.0
    # Shrink each CANDIDATE box inward by this fraction of its own
    # width/height (each side) before sampling its color histogram -- e.g.
    # 0.15 keeps only the middle 70%x70% of the box. Unlike the reference
    # photos (masked by MobileSAM to pure object pixels), a video candidate
    # box has no per-candidate segmentation, so its rectangular edges/
    # corners commonly include background that dilutes the color
    # histogram -- hurts black/white discrimination specifically more than
    # colorful objects (background rarely shares a distinct HUE, but
    # commonly sits at a MID brightness that pulls both a black and a white
    # candidate's Value histogram toward each other). 0.0 = no-op.
    candidate_inset_ratio: 0.15

# ----------------------------------------------------------------------------
# STAGE 4 — Tracking between keyframes
# ----------------------------------------------------------------------------
stage4:
  tracker: builtin           # <<< "builtin" | "litetrack" | "none"
                             #   builtin   = OpenCV CSRT/KCF (no extra weights)
                             #   litetrack = LiteTrack-B4 ONNX (needs weights)
                             #   none      = run detection on EVERY frame
  builtin:
    algorithm: csrt          # csrt | kcf | mosse
  litetrack:
    onnx_path: null          # REQUIRED if tracker=litetrack; else fail clearly
    input_size: 256
  tracker_conf_threshold: 0.40   # τ: below this → re-detect immediately
  max_track_age: 30          # frames a track survives without re-detection

  # A single spurious "detect" (keyframe hit, or re-detect after track loss)
  # can spawn a tracker that survives up to max_track_age frames -- far
  # longer than stage5.min_tube_length can filter out. Matters most for
  # pipeline.detector=geco2, whose per-frame score is relative-only (see
  # scripts/check_geco2_score_separation.py) and so structurally cannot
  # express "target absent this frame". When enabled, a detect is not
  # trusted (tracker not (re)initialized) until `required_hits` consecutive
  # detect attempts agree spatially (IoU >= iou_threshold) -- attacks the
  # amplification directly, independent of whether the detector's raw score
  # separates present/absent. Off by default (does not change existing
  # runs); applies to both legacy and geco2 detectors (shared tracking loop).
  confirm_detections:
    enabled: false
    required_hits: 2
    iou_threshold: 0.3

  # Every verify_interval frames of ACTIVE tracking (builtin/litetrack, not
  # tracker=none), re-embed the currently-tracked crop with DINOv2 and
  # cross-check it against the prototype -- the real correctness check
  # BuiltinTracker's own confidence cannot provide (it returns a fixed 0.9
  # placeholder on any OpenCV-reported success). If the re-embedded crop no
  # longer matches, forces a re-detect even though OpenCV still reports
  # tracking as nominally successful -- catches silent drift instead of
  # letting it persist for the full max_track_age.
  # Independent of confirm_detections above -- that guards against a single
  # SPURIOUS detection before a track ever starts; this guards against a
  # track that started fine but DRIFTED after the fact. Both can be on.
  # Needs prototype.npz (DINOv2): always present on the legacy pipeline; on
  # pipeline.detector=geco2 only when stage123_geco2.cosine_rescore.enabled
  # built one -- otherwise this silently has no effect (logged once).
  # 0 (default) = disabled, reproduces the original tracking logic exactly.
  verify_interval: 0

# ----------------------------------------------------------------------------
# STAGE 5 — Spatio-temporal output
# ----------------------------------------------------------------------------
stage5:
  temporal_smoothing:
    enabled: true
    method: ema              # ema | none
    ema_alpha: 0.6
  min_tube_length: 2         # discard tubes shorter than this (frames)
  fill_short_gaps: 3         # linearly interpolate gaps <= this many frames

# ----------------------------------------------------------------------------
# ACCURACY MODE — progressively enables domain-gap mitigations.
#   baseline       : single-scale, plain prototype
#   cheap_boosters : multi-scale scan + tuned NMS/thresh + multi-ref averaging
#   max_accuracy   : + synthetic viewpoint aug + CD-ViTO-style domain prompter
# Individual sub-toggles let each technique be ablated independently.
# ----------------------------------------------------------------------------
accuracy:
  mode: baseline             # baseline | cheap_boosters | max_accuracy

  cheap_boosters:
    multi_scale_scan: true
    scales: [0.75, 1.0, 1.5]
    tuned_nms: true
    multi_reference_embedding: true   # keep per-ref protos + ensemble match
    # How per-ref similarity scores get pooled into one, when
    # multi_reference_embedding is active. "mean" (default) averages across
    # all 3 refs -- a candidate matching only ONE ref well (e.g. object shot
    # from 3 different angles, candidate's own angle resembles just one of
    # them) gets that good score diluted by the other two weak ones. "max"
    # takes the single best-matching ref's score instead, so a genuinely
    # good match isn't dragged down by refs shot from a different angle.
    multi_ref_pooling: mean   # "mean" | "max"

  max_accuracy:
    synthetic_viewpoint_aug:
      enabled: true
      method: homography     # homography | perspective_warp
      num_synth_views: 6
      pitch_range_deg: [40, 85]   # simulate top-down
      fold_into_prototype: true
    domain_prompter:
      enabled: true
      # CD-ViTO-style: synthesize "imaginary domain" feature shifts and
      # align candidate features toward the reference style.
      num_prompts: 4
      strength: 0.3

# ----------------------------------------------------------------------------
# EVALUATION (ST-IoU)
# ----------------------------------------------------------------------------
eval:
  metric: st_iou
  # Per-frame IoU averaged over the TEMPORAL UNION of pred & GT tubes;
  # frames present in only one tube contribute IoU = 0.
  spatial_iou_type: standard
  report_per_video: true
